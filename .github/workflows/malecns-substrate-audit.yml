name: malecns-substrate-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_malecns_sources.py'
      - 'docs/SUBSTRATE_CONTRACT.ja.md'
      - '.github/workflows/malecns-substrate-audit.yml'

permissions:
  contents: read

concurrency:
  group: malecns-substrate-audit
  cancel-in-progress: true

env:
  BASE_URL: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS_FILE: body-annotations-male-cns-v1.0-minconf-0.5.feather
  NT_FILE: body-neurotransmitters-male-cns-v1.0.feather
  CONNECTIVITY_FILE: connectome-weights-male-cns-v1.0-minconf-0.5.feather

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit reader
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=16,<24'

      - name: Restore immutable MaleCNS source cache
        id: source-cache
        uses: actions/cache@v4
        with:
          path: external/malecns-v1.0
          key: malecns-v1.0-flat-connectome-official-20260608

      - name: Download official MaleCNS v1.0 files on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p external/malecns-v1.0
          for f in "$ANNOTATIONS_FILE" "$NT_FILE" "$CONNECTIVITY_FILE"; do
            curl -fL --retry 5 --retry-all-errors \
              -o "external/malecns-v1.0/$f" "$BASE_URL/$f"
            test -s "external/malecns-v1.0/$f"
          done

      - name: Audit source hashes and schemas
        run: |
          python scripts/inspect_malecns_sources.py \
            --annotations "external/malecns-v1.0/$ANNOTATIONS_FILE" \
            --neurotransmitters "external/malecns-v1.0/$NT_FILE" \
            --connectivity "external/malecns-v1.0/$CONNECTIVITY_FILE" \
            --annotations-url "$BASE_URL/$ANNOTATIONS_FILE" \
            --neurotransmitters-url "$BASE_URL/$NT_FILE" \
            --connectivity-url "$BASE_URL/$CONNECTIVITY_FILE" \
            --out runs/malecns-source-manifest.json

      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: malecns-v1.0-source-manifest
          path: runs/malecns-source-manifest.json
          if-no-files-found: error
          retention-days: 30
