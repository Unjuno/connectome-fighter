name: publish-flybody-runtime-addon

on:
  workflow_run:
    workflows: [precompile-arena-brian2-cython-cache]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/connectome_fighter/flybody_neural_adapter.py'
      - 'scripts/run_live_flybody_publisher.py'
      - 'deploy/arena-runtime/bootstrap-proxy.mjs'
      - 'deploy/arena-runtime/start-session.sh'
      - '.github/workflows/publish-flybody-runtime-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-flybody-runtime-addon-single-writer
  cancel-in-progress: false

env:
  TARGET_TAG: arena-runtime-latest
  FLYBODY_COMMIT: d015e9bfe441bd90ae431bac24c55cb74bdbce26
  FLYBODY_ADAPTER_ID: malecns-annotated-motor-to-flybody-tripod-v2
  UV_VERSION: 0.12.12

jobs:
  package:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software OpenGL runtime used by the physical proof
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          ldconfig -p | grep -q 'libOSMesa.so'
      - name: Download the compilerless rolling runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runs/flybody-addon
          mkdir -p runs/flybody-addon/source runs/flybody-addon/extract
          gh release download "$TARGET_TAG" --pattern 'arena-runtime.tar.gz' --pattern 'arena-runtime.tar.gz.sha256' --dir runs/flybody-addon/source
          expected="$(grep -Eo '[a-f0-9]{64}' runs/flybody-addon/source/arena-runtime.tar.gz.sha256 | head -1)"
          actual="$(sha256sum runs/flybody-addon/source/arena-runtime.tar.gz | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          tar -C runs/flybody-addon/extract -xzf runs/flybody-addon/source/arena-runtime.tar.gz
          test -d runs/flybody-addon/extract/arena-runtime
      - name: Overlay exact FlyBody spectator source from main
        run: |
          set -euo pipefail
          ROOT="$(realpath runs/flybody-addon/extract/arena-runtime)"
          install -m 0644 src/connectome_fighter/flybody_neural_adapter.py "$ROOT/repo/src/connectome_fighter/flybody_neural_adapter.py"
          install -m 0755 scripts/run_live_flybody_publisher.py "$ROOT/repo/scripts/run_live_flybody_publisher.py"
          install -m 0755 deploy/arena-runtime/bootstrap-proxy.mjs "$ROOT/bin/bootstrap-proxy.mjs"
          install -m 0755 deploy/arena-runtime/start-session.sh "$ROOT/bin/start-session"
          cmp -s src/connectome_fighter/flybody_neural_adapter.py "$ROOT/repo/src/connectome_fighter/flybody_neural_adapter.py"
          cmp -s scripts/run_live_flybody_publisher.py "$ROOT/repo/scripts/run_live_flybody_publisher.py"
          ADAPTER_SHA="$(sha256sum src/connectome_fighter/flybody_neural_adapter.py | awk '{print $1}')"
          PUBLISHER_SHA="$(sha256sum scripts/run_live_flybody_publisher.py | awk '{print $1}')"
          BOOTSTRAP_SHA="$(sha256sum deploy/arena-runtime/bootstrap-proxy.mjs | awk '{print $1}')"
          SESSION_SHA="$(sha256sum deploy/arena-runtime/start-session.sh | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "FLYBODY_ADAPTER_SOURCE_SHA=$ADAPTER_SHA" >> "$GITHUB_ENV"
          echo "FLYBODY_PUBLISHER_SOURCE_SHA=$PUBLISHER_SHA" >> "$GITHUB_ENV"
          echo "FLYBODY_BOOTSTRAP_SOURCE_SHA=$BOOTSTRAP_SHA" >> "$GITHUB_ENV"
          echo "FLYBODY_SESSION_SOURCE_SHA=$SESSION_SHA" >> "$GITHUB_ENV"
          echo "FLYBODY_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
      - name: Install pinned upstream FlyBody into isolated spectator site
        run: |
          set -euo pipefail
          python -m pip install --quiet "uv==$UV_VERSION"
          ROOT="$(realpath runs/flybody-addon/extract/arena-runtime)"
          rm -rf "$ROOT/runtime/siteflybody"
          mkdir -p "$ROOT/runtime/siteflybody"
          uv pip install --python "$(which python)" --target "$ROOT/runtime/siteflybody" "flybody @ git+https://github.com/TuragaLab/flybody.git@$FLYBODY_COMMIT"
          test -d "$ROOT/runtime/siteflybody/flybody"
          test -d "$ROOT/runtime/siteflybody/dm_control"
          test -d "$ROOT/runtime/siteflybody/mujoco"
          sed -i 's/CONNECTOME_MUJOCO_GL:-egl/CONNECTOME_MUJOCO_GL:-osmesa/g' "$ROOT/bin/start-session"
          grep -Fq 'CONNECTOME_MUJOCO_GL:-osmesa' "$ROOT/bin/start-session"
      - name: Prove exact source and real 59-actuator MuJoCo body
        run: |
          set -euo pipefail
          ROOT="$(realpath runs/flybody-addon/extract/arena-runtime)"
          test "$(sha256sum "$ROOT/repo/src/connectome_fighter/flybody_neural_adapter.py" | awk '{print $1}')" = "$FLYBODY_ADAPTER_SOURCE_SHA"
          test "$(sha256sum "$ROOT/repo/scripts/run_live_flybody_publisher.py" | awk '{print $1}')" = "$FLYBODY_PUBLISHER_SOURCE_SHA"
          grep -Fq "$FLYBODY_ADAPTER_ID" "$ROOT/repo/src/connectome_fighter/flybody_neural_adapter.py"
          node --check "$ROOT/bin/bootstrap-proxy.mjs"
          bash -n "$ROOT/bin/start-session"
          PYTHONPATH="$ROOT/repo/src:$ROOT/runtime/siteflybody" MUJOCO_GL=osmesa python - <<'PY'
          import gc
          import numpy as np
          from flybody.fly_envs import template_task
          from connectome_fighter.flybody_neural_adapter import ADAPTER_ID, neural_fly_command, flybody_action
          assert ADAPTER_ID == 'malecns-annotated-motor-to-flybody-tripod-v2'
          env=template_task(random_state=np.random.RandomState(7), disable_wings=True, time_limit=1.0)
          env.reset(); spec=env.action_spec(); names=str(spec.name or '').split()
          command=neural_fly_command([
              {'body_id':1,'spikes':16,'superclass':'vnc_motor','soma_neuromere':'T1','root_side':'L'},
              {'body_id':2,'spikes':8,'superclass':'vnc_motor','soma_neuromere':'T2','root_side':'R'},
          ])
          zero=neural_fly_command([])
          zero_a=flybody_action(names,spec.minimum,spec.maximum,zero,0.1)
          zero_b=flybody_action(names,spec.minimum,spec.maximum,zero,4.9)
          assert np.allclose(zero_a,zero_b)
          action=flybody_action(names,spec.minimum,spec.maximum,command,0.5)
          env.step(action)
          center=(np.asarray(spec.minimum,dtype=float)+np.asarray(spec.maximum,dtype=float))/2.0
          assert spec.shape[0] == 59
          assert float(np.max(np.abs(action-center))) > 1e-6
          pixels=env.physics.render(height=120,width=160,camera_id=1)
          assert pixels.shape==(120,160,3) and float(np.asarray(pixels).std())>1.0
          print({'flybody_physics':True,'adapter':ADAPTER_ID,'action_dim':59,'zero_phase_invariant':True,'backend':'osmesa'})
          del env; gc.collect()
          PY
      - name: Mark FlyBody provenance in runtime manifest
        run: |
          set -euo pipefail
          ROOT="$(realpath runs/flybody-addon/extract/arena-runtime)"
          python - "$ROOT/manifest.json" "$FLYBODY_COMMIT" "$FLYBODY_ADAPTER_ID" "$FLYBODY_SOURCE_COMMIT" "$FLYBODY_ADAPTER_SOURCE_SHA" "$FLYBODY_PUBLISHER_SOURCE_SHA" "$FLYBODY_BOOTSTRAP_SOURCE_SHA" "$FLYBODY_SESSION_SOURCE_SHA" <<'PY'
          import json, pathlib, sys
          path=pathlib.Path(sys.argv[1]); commit,adapter,source_commit,adapter_sha,publisher_sha,bootstrap_sha,session_sha=sys.argv[2:]
          m=json.loads(path.read_text(encoding='utf-8'))
          assert m['kind']=='connectome-fighter-arena-runtime-bundle'
          assert m['learning_enabled'] is False and m['policy_pixel_access'] is False
          assert m.get('brian2_compilerless_reuse_verified') is True
          m['schema_version']=max(4,int(m.get('schema_version',0)))
          m['bundle_profile']='public-screendata-flybody-jlink-v4'
          m['flybody_physics_spectator']=True
          m['flybody_upstream_repository']='TuragaLab/flybody'
          m['flybody_upstream_commit']=commit
          m['flybody_p1_path']='/flybody-p1.png'; m['flybody_p2_path']='/flybody-p2.png'; m['flybody_state_path']='/flybody.json'
          m['flybody_policy_access']=False; m['flybody_game_telemetry_position_used']=False; m['flybody_mujoco_gl']='osmesa'
          m['flybody_neural_adapter']=adapter; m['flybody_source_commit']=source_commit
          m['flybody_adapter_source_sha256']=adapter_sha; m['flybody_publisher_source_sha256']=publisher_sha
          m['flybody_bootstrap_source_sha256']=bootstrap_sha; m['flybody_session_source_sha256']=session_sha
          m['note']='Official FightingICE is primary. FlyBody is separate MuJoCo spectator physics driven only from annotated MaleCNS motor activity through the project-defined v2 adapter.'
          path.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Deterministically repack and replace rolling runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f runs/flybody-addon/arena-runtime.tar.gz runs/flybody-addon/arena-runtime.tar.gz.sha256
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C runs/flybody-addon/extract -cf - arena-runtime | gzip -n > runs/flybody-addon/arena-runtime.tar.gz
          (cd runs/flybody-addon && sha256sum arena-runtime.tar.gz > arena-runtime.tar.gz.sha256)
          FINAL_RUNTIME_SHA="$(sha256sum runs/flybody-addon/arena-runtime.tar.gz | awk '{print $1}')"
          python - "$FINAL_RUNTIME_SHA" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('runs/flybody-addon/arena-runtime.tar.gz')
          pathlib.Path('runs/flybody-addon/arena-runtime-size.json').write_text(json.dumps({'archive_size_bytes':p.stat().st_size,'archive_sha256':sys.argv[1],'bundle_profile':'public-screendata-flybody-jlink-v4'},indent=2)+'\n')
          PY
          gh release upload "$TARGET_TAG" runs/flybody-addon/arena-runtime.tar.gz runs/flybody-addon/arena-runtime.tar.gz.sha256 runs/flybody-addon/arena-runtime-size.json runs/flybody-addon/extract/arena-runtime/manifest.json --clobber
          visible=0
          for i in $(seq 1 60); do
            remote="$(curl -fsSL "https://github.com/Unjuno/connectome-fighter/releases/download/$TARGET_TAG/arena-runtime.tar.gz.sha256?t=$(date +%s%N)" | grep -Eo '[a-f0-9]{64}' | head -1 || true)"
            if [[ "$remote" == "$FINAL_RUNTIME_SHA" ]]; then visible=1; break; fi
            sleep 3
          done
          test "$visible" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flybody-runtime-addon-proof
          path: |
            runs/flybody-addon/arena-runtime-size.json
            runs/flybody-addon/extract/arena-runtime/manifest.json
