name: shiu-lif-reference-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shiu_reference_smoke.py'
      - 'docs/SUBSTRATE_CONTRACT.ja.md'
      - '.github/workflows/shiu-lif-reference-gate.yml'

permissions:
  contents: read

concurrency:
  group: shiu-lif-reference-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5

jobs:
  reference-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install published reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.24.0' \
            'pandas==1.5.3' \
            'pyarrow==10.0.1' \
            'joblib==1.2.0' \
            'brian2==2.5.1'

      - name: Fetch pinned Shiu reference model
        run: |
          mkdir -p external/shiu-reference artifacts/shiu-reference
          curl -fL --retry 3 \
            -o external/shiu-reference/model.py \
            "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          sha256sum external/shiu-reference/model.py | tee artifacts/shiu-reference/model.py.sha256

      - name: Execute reference LIF gate
        run: |
          python scripts/shiu_reference_smoke.py \
            --reference-model external/shiu-reference/model.py \
            --out artifacts/shiu-reference/golden.json

      - uses: actions/upload-artifact@v4
        with:
          name: shiu-lif-reference-gate
          path: artifacts/shiu-reference/
          if-no-files-found: error
          retention-days: 30
