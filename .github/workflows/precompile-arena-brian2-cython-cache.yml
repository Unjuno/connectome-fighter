name: precompile-arena-brian2-cython-cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/malecns_lif_worker.py'
      - 'scripts/precompile_arena_brian2_cache.py'
      - 'src/connectome_fighter/flybody_neural_adapter.py'
      - 'scripts/run_live_flybody_publisher.py'
      - 'deploy/arena-runtime/bootstrap-proxy.mjs'
      - 'deploy/arena-runtime/start-session.sh'
      - '.github/workflows/precompile-arena-brian2-cython-cache.yml'
      - '.github/workflows/publish-flybody-runtime-addon.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/malecns_lif_worker.py'
      - 'scripts/precompile_arena_brian2_cache.py'
      - 'src/connectome_fighter/flybody_neural_adapter.py'
      - 'scripts/run_live_flybody_publisher.py'
      - 'deploy/arena-runtime/bootstrap-proxy.mjs'
      - 'deploy/arena-runtime/start-session.sh'
      - '.github/workflows/precompile-arena-brian2-cython-cache.yml'
      - '.github/workflows/publish-flybody-runtime-addon.yml'
  workflow_run:
    workflows: [publish-arena-runtime-bundle]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: arena-runtime-rolling-release-single-writer
  cancel-in-progress: false

env:
  TARGET_TAG: arena-runtime-latest
  VERCEL_RUNTIME_ROOT: /home/vercel-sandbox/connectome-runtime/arena-runtime

jobs:
  cache-proof-and-publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify current immutable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runs/cache-postprocess
          mkdir -p runs/cache-postprocess/source
          gh release download "$TARGET_TAG" \
            --pattern arena-runtime.tar.gz \
            --pattern arena-runtime.tar.gz.sha256 \
            --dir runs/cache-postprocess/source
          expected="$(grep -Eo '[a-f0-9]{64}' runs/cache-postprocess/source/arena-runtime.tar.gz.sha256 | head -1)"
          test -n "$expected"
          actual="$(sha256sum runs/cache-postprocess/source/arena-runtime.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -C runs/cache-postprocess -xzf runs/cache-postprocess/source/arena-runtime.tar.gz
          ROOT="$(realpath runs/cache-postprocess/arena-runtime)"
          test -x "$ROOT/$(cat "$ROOT/runtime/python310.path")"
          test -s "$ROOT/data/malecns-shiu-strict-v1/connectivity.parquet"
          test -s "$ROOT/shiu/model.py"
          echo "RUNTIME_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Overlay current canonical worker implementation
        run: |
          set -euo pipefail
          install -m 0755 scripts/malecns_lif_worker.py "$RUNTIME_ROOT/repo/scripts/malecns_lif_worker.py"
          python -m py_compile scripts/precompile_arena_brian2_cache.py

      - name: Reproduce exact Vercel runtime path
        run: |
          set -euo pipefail
          sudo rm -rf /home/vercel-sandbox/connectome-runtime
          sudo mkdir -p /home/vercel-sandbox/connectome-runtime
          sudo ln -s "$RUNTIME_ROOT" "$VERCEL_RUNTIME_ROOT"
          test "$(readlink -f "$VERCEL_RUNTIME_ROOT")" = "$RUNTIME_ROOT"
          VREF="$VERCEL_RUNTIME_ROOT/$(cat "$RUNTIME_ROOT/runtime/python310.path")"
          test -x "$VREF"
          actual="$($VREF -c 'import sys; print(sys.executable)')"
          test "$actual" = "$VREF"
          echo "VERCEL_REFERENCE_PYTHON=$VREF" >> "$GITHUB_ENV"

      - name: Precompile canonical Brian2 Cython cache and prove compilerless reuse
        run: |
          set -euo pipefail
          python scripts/precompile_arena_brian2_cache.py \
            --runtime-root "$RUNTIME_ROOT" \
            --vercel-root "$VERCEL_RUNTIME_ROOT" \
            --character GARNET \
            --seed 20260912 \
            --timeout-sec 1800 \
            | tee runs/cache-postprocess/brian2-cache-proof.json.log
          test -s "$RUNTIME_ROOT/runtime/brian2-cython-cache-manifest.json"
          python - "$RUNTIME_ROOT/runtime/brian2-cython-cache-manifest.json" "$VERCEL_REFERENCE_PYTHON" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          m=json.loads(p.read_text())
          assert m['kind']=='connectome-fighter-brian2-cython-cache'
          assert m['canonical_model']=='MaleCNS v1.0 + pinned Shiu LIF'
          assert m['codegen_target']=='cython'
          assert m['compilerless_reuse_verified'] is True
          assert m['expected_sys_executable']==sys.argv[2]
          assert m['versions']['brian2']=='2.5.1'
          assert m['versions']['cython']=='0.29.36'
          assert m['versions']['numpy']=='1.24.0'
          assert m['shared_object_count'] > 0
          assert m['neurons'] > 150000
          assert m['synapses'] > 1000000
          print(json.dumps(m,indent=2,sort_keys=True))
          PY

      - name: Stamp cache provenance into runtime manifest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          python - "$RUNTIME_ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          manifest_path=root/'manifest.json'
          cache_path=root/'runtime/brian2-cython-cache-manifest.json'
          worker_path=root/'repo/scripts/malecns_lif_worker.py'
          m=json.loads(manifest_path.read_text())
          c=json.loads(cache_path.read_text())
          m['schema_version']=max(3,int(m.get('schema_version',0)))
          m['brian2_codegen_target']='cython'
          m['brian2_cython_cache_precompiled']=True
          m['brian2_cython_cache_manifest']='runtime/brian2-cython-cache-manifest.json'
          m['brian2_cython_cache_manifest_sha256']=hashlib.sha256(cache_path.read_bytes()).hexdigest()
          m['brian2_cython_cache_tree_sha256']=c['cache_tree_sha256']
          m['brian2_compilerless_reuse_verified']=True
          m['brian2_expected_sys_executable']=c['expected_sys_executable']
          m['malecns_worker_sha256']=hashlib.sha256(worker_path.read_bytes()).hexdigest()
          m['bundle_profile']='minimal-fightingice-jlink-precompiled-cython-v1'
          m['note']='Canonical runtime plus precompiled Brian2 Cython cache. Deployment staging is intentionally owned by the dedicated Connectome Vercel project, not by this release workflow.'
          manifest_path.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print(json.dumps(m,indent=2,sort_keys=True))
          PY

      - name: Repack deterministic runtime archive
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          rm -f runs/cache-postprocess/arena-runtime.tar.gz runs/cache-postprocess/arena-runtime.tar.gz.sha256 runs/cache-postprocess/arena-runtime-size.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C runs/cache-postprocess -cf - arena-runtime | gzip -n > runs/cache-postprocess/arena-runtime.tar.gz
          sha="$(sha256sum runs/cache-postprocess/arena-runtime.tar.gz | awk '{print $1}')"
          printf '%s  %s\n' "$sha" arena-runtime.tar.gz > runs/cache-postprocess/arena-runtime.tar.gz.sha256
          python - "$sha" <<'PY'
          import json, pathlib, sys
          archive=pathlib.Path('runs/cache-postprocess/arena-runtime.tar.gz')
          payload={
              'archive_size_bytes':archive.stat().st_size,
              'archive_sha256':sys.argv[1],
              'bundle_profile':'minimal-fightingice-jlink-precompiled-cython-v1',
              'brian2_cython_cache_precompiled':True,
              'compilerless_reuse_verified':True,
          }
          pathlib.Path('runs/cache-postprocess/arena-runtime-size.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Publish compilerless canonical runtime assets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TARGET_TAG" \
            runs/cache-postprocess/arena-runtime.tar.gz \
            runs/cache-postprocess/arena-runtime.tar.gz.sha256 \
            runs/cache-postprocess/arena-runtime-size.json \
            "$RUNTIME_ROOT/manifest.json" \
            "$RUNTIME_ROOT/runtime/brian2-cython-cache-manifest.json" \
            --clobber
          expected="$(sha256sum runs/cache-postprocess/arena-runtime.tar.gz | awk '{print $1}')"
          visible=0
          for i in $(seq 1 60); do
            remote="$(curl -fsSL "https://github.com/Unjuno/connectome-fighter/releases/download/$TARGET_TAG/arena-runtime.tar.gz.sha256?t=$(date +%s%N)" | grep -Eo '[a-f0-9]{64}' | head -1 || true)"
            if [[ "$remote" == "$expected" ]]; then visible=1; break; fi
            sleep 3
          done
          test "$visible" -eq 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brian2-compilerless-runtime-proof
          path: |
            runs/cache-postprocess/brian2-cache-proof.json.log
            runs/cache-postprocess/arena-runtime-size.json

      - name: Cleanup Vercel-path build alias
        if: always()
        run: sudo rm -f "$VERCEL_RUNTIME_ROOT" || true
