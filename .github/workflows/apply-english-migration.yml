name: apply-english-migration-on-feature-branch
on:
  push:
    branches: [feat/english-project-20260914]
    paths: ['.github/workflows/apply-english-migration.yml']
permissions:
  contents: write
concurrency:
  group: one-time-english-feature-branch-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'Unjuno/connectome-fighter' && github.ref == 'refs/heads/feat/english-project-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/english-project-20260914
      - name: Apply reviewed one-time translations on the feature branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/english-project-20260914
          python .github/english_migration.py
          git rm .github/english_migration.py .github/workflows/apply-english-migration.yml
          python scripts/check_project_english.py
          python scripts/validate_public_surface_contract.py
          node --check scripts/test_observatory_design.mjs
          git add app/layout.tsx app/live-client.tsx app/live/arena-client.tsx app/observatory.tsx scripts/test_observatory_design.mjs scripts/validate_public_surface_contract.py spectator/index.html site/index.html tests/test_flybody_publisher_contract.py README.ja.md docs/PUBLIC_SURFACE_SPLIT.ja.md docs/LIVE_PUBLICATION_GATE.ja.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply English-only project surfaces and remove one-time migration'
          git push origin HEAD:feat/english-project-20260914
