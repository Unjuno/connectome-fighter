name: reward-design-offline

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Successful malecns-baseline-batch run ID to rescore'
        required: false
        default: '34629644845'
  workflow_run:
    workflows: [malecns-baseline-batch]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/score_reward_candidates.py'
      - 'scripts/score_stalemate_reward.py'
      - 'scripts/score_engagement_potential.py'
      - '.github/workflows/reward-design-offline.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: reward-design-offline-${{ github.event.workflow_run.id || inputs.baseline_run_id || github.sha }}
  cancel-in-progress: true

jobs:
  score:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fast-forward to latest public baseline data
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve baseline run ID
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.baseline_run_id }}"
          else
            RUN_ID="34629644845"
          fi
          test -n "$RUN_ID"
          echo "BASELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Scoring baseline run $RUN_ID"

      - name: Download canonical baseline artifacts (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: malecns-baseline-*
          path: runs/reward-input

      - name: Download canonical baseline artifacts (dispatch or push)
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id || '34629644845' }}
          pattern: malecns-baseline-*
          path: runs/reward-input

      - name: Offline-score R0/R1/R2 candidates
        run: |
          mkdir -p runs/reward-analysis
          python scripts/score_reward_candidates.py \
            --root runs/reward-input \
            --out-json runs/reward-analysis/reward-analysis.json \
            --out-csv runs/reward-analysis/reward-events.csv \
            --max-hp 400 \
            --damage-unit-hp 10

      - name: Offline-score R2b anti-stalemate candidate
        run: |
          python scripts/score_stalemate_reward.py \
            --events runs/reward-analysis/reward-events.csv \
            --out runs/reward-analysis/stalemate-analysis.json

      - name: Offline-score R2c engagement potential
        run: |
          python scripts/score_engagement_potential.py \
            --root runs/reward-input \
            --out runs/reward-analysis/engagement-analysis.json \
            --stage-width 960 \
            --damage-unit-hp 10

      - name: Sanity gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('runs/reward-analysis/reward-analysis.json'))
          s=json.load(open('runs/reward-analysis/stalemate-analysis.json'))
          e=json.load(open('runs/reward-analysis/engagement-analysis.json'))
          assert d['status']=='PASS' and s['status']=='PASS' and e['status']=='PASS'
          assert d['learning_performed'] is False and s['learning_performed'] is False and e['learning_performed'] is False
          assert d['guardrails']['same_logged_trajectories_for_all_candidates'] is True
          assert d['guardrails']['current_action_randomness_unchanged'] is True
          assert s['guardrails']['same_trajectories'] is True
          assert e['guardrails']['same_trajectories'] is True
          assert e['guardrails']['no_specific_action_reward'] is True
          assert d['input']['game_rounds'] > 0
          print(json.dumps({
              'baseline_run_id': '${{ env.BASELINE_RUN_ID }}',
              'game_rounds': d['input']['game_rounds'],
              'decision_windows_per_brain': d['input']['decision_windows_per_brain'],
              'R0_decision_nonzero_rate': d['candidate_families']['R0_terminal_sign']['decision_reward']['nonzero_rate'],
              'damage_window_rate': d['observed']['damage_window_rate'],
              'no_damage_draw_rate': s['no_damage_draw_rate'],
              'R2b_first_config_decision_nonzero_rate': s['configs'][0]['decision_reward']['nonzero_rate'],
              'R2c_first_config_decision_nonzero_rate': e['configs'][0]['decision_reward']['nonzero_rate'],
          }, indent=2))
          PY

      - name: Publish compact reward analysis for Pages
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, os, pathlib
          pairs=[
              ('runs/reward-analysis/reward-analysis.json','site/data/reward-analysis.json'),
              ('runs/reward-analysis/stalemate-analysis.json','site/data/stalemate-analysis.json'),
              ('runs/reward-analysis/engagement-analysis.json','site/data/engagement-analysis.json'),
          ]
          for src,dst in pairs:
              data=json.load(open(src))
              data['source_baseline_run_id']=int(os.environ['BASELINE_RUN_ID'])
              data['source_baseline_run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['BASELINE_RUN_ID']}"
              pathlib.Path(dst).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data/reward-analysis.json site/data/stalemate-analysis.json site/data/engagement-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update offline reward analysis [skip ci]'
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reward-design-offline-${{ env.BASELINE_RUN_ID }}
          path: runs/reward-analysis/
          if-no-files-found: error
          retention-days: 30
