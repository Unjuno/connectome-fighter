name: malecns-coordinate-index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_malecns_coordinate_index.py'
      - '.github/workflows/malecns-coordinate-index.yml'

permissions:
  contents: read

concurrency:
  group: malecns-coordinate-index
  cancel-in-progress: true

env:
  BASE_URL: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS_FILE: body-annotations-male-cns-v1.0-minconf-0.5.feather
  SOURCE_CACHE_KEY: malecns-v1.0-flat-connectome-official-20260608
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  COORD_CACHE_KEY: malecns-v1.0-coordinate-index-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coordinate builder dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=16,<24'
      - name: Restore immutable MaleCNS source cache
        uses: actions/cache@v4
        with:
          path: external/malecns-v1.0
          key: ${{ env.SOURCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Restore coordinate index cache
        id: coord-cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-coordinate-v1
          key: ${{ env.COORD_CACHE_KEY }}
      - name: Build released-coordinate index
        if: steps.coord-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf data/processed/malecns-coordinate-v1
          python scripts/build_malecns_coordinate_index.py \
            --annotations "external/malecns-v1.0/$ANNOTATIONS_FILE" \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --out data/processed/malecns-coordinate-v1
      - name: Validate coordinate index
        run: |
          test -s data/processed/malecns-coordinate-v1/body_coordinates.csv.gz
          test -s data/processed/malecns-coordinate-v1/manifest.json
          python - <<'PY'
          import gzip, json
          m=json.load(open('data/processed/malecns-coordinate-v1/manifest.json'))
          assert m['dataset']=='male-cns:v1.0'
          assert m['purpose']=='spectator-only-coordinate-index'
          assert m['policy_access'] is False
          assert m['coverage'] > 0.9
          with gzip.open('data/processed/malecns-coordinate-v1/body_coordinates.csv.gz','rt') as f:
              header=f.readline().strip()
              first=f.readline().strip()
          assert header=='bodyId,pos_x,pos_y,pos_z', header
          assert first, 'coordinate table empty'
          print(json.dumps(m, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: malecns-coordinate-index-manifest
          path: data/processed/malecns-coordinate-v1/manifest.json
          if-no-files-found: error
          retention-days: 30
