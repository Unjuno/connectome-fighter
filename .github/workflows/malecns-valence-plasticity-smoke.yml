name: malecns-valence-plasticity-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/malecns-valence-plasticity-smoke.yml'
      - 'src/connectome_fighter/valence_plasticity.py'
      - 'scripts/update_malecns_valence_plasticity.py'
      - 'scripts/materialize_malecns_valence_adapter.py'
      - 'configs/reward_r2d_v0.json'
      - 'configs/plasticity_valence_v0.json'

permissions:
  contents: read

concurrency:
  group: malecns-valence-plasticity-smoke
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  VALENCE_CACHE_KEY: malecns-v1.0-kc-mbon-valence-v1
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.24.0' 'pandas==1.5.3' 'pyarrow==10.0.1' 'joblib==1.2.0' 'Cython==0.29.36' 'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"

      - name: Set up bridge/update Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge/update dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==23.0.1' 'pyftg==2.3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore valence partition cache
        id: valence-cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-valence-v1
          key: ${{ env.VALENCE_CACHE_KEY }}

      - name: Build valence partition on cache miss
        if: steps.valence-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf data/processed/malecns-valence-v1
          python scripts/build_malecns_valence_partition.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --connectivity data/processed/malecns-shiu-strict-v1/connectivity.parquet \
            --adapter-manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out-dir data/processed/malecns-valence-v1

      - name: Build fixed game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 --decision-window-ms 20 --neutral-min-spikes 1

      - name: Fetch pinned Shiu model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 -o external/shiu-reference/model.py "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713
      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Start FightingICE
        run: |
          mkdir -p runs/valence-smoke
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/valence-smoke/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/valence-smoke/fightingice.pid"
          )
          for i in $(seq 1 90); do
            grep -q 'Socket server is started' runs/valence-smoke/fightingice.log 2>/dev/null && exit 0
            kill -0 "$(cat runs/valence-smoke/fightingice.pid)" 2>/dev/null || exit 1
            sleep 1
          done
          exit 1

      - name: Run generation-0 canonical match
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 700101 --seed-p2 700202 \
            --reference-python "$PY310" --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 --games 1 --expected-rounds 1 --timeout 900 \
            --trainable-trace --run-id valence-before --out runs/valence-smoke

      - name: Apply R2d-v0 to GARNET only
        run: |
          mkdir -p runs/valence-smoke/state
          PYTHONPATH=src python scripts/update_malecns_valence_plasticity.py \
            --character GARNET --side 1 \
            --round-trace runs/valence-smoke/valence-before/p1.jsonl \
            --spikes runs/valence-smoke/valence-before/p1-brain/spikes.parquet \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --reward-config configs/reward_r2d_v0.json \
            --plasticity-config configs/plasticity_valence_v0.json \
            --state runs/valence-smoke/state/GARNET.npz \
            --out-summary runs/valence-smoke/garnet-update.json
          python - <<'PY'
          import json
          u=json.load(open('runs/valence-smoke/garnet-update.json'))
          assert u['status']=='PASS'
          assert u['state']['generation']==1 and u['state']['matches']==1
          assert u['updates']['potentiated_edges']==0
          assert u['updates']['depressed_edges']>0
          assert u['updates']['max_multiplier']<=1.0
          print(json.dumps({'signals':u['signals'],'updates':u['updates']},indent=2))
          PY

      - name: Materialize GARNET generation 1 adapter
        run: |
          rm -rf runs/valence-smoke/garnet-g1-adapter
          PYTHONPATH=src python scripts/materialize_malecns_valence_adapter.py \
            --base-adapter data/processed/malecns-shiu-strict-v1 \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --state runs/valence-smoke/state/GARNET.npz \
            --character GARNET \
            --plasticity-config configs/plasticity_valence_v0.json \
            --out runs/valence-smoke/garnet-g1-adapter

      - name: Run generation-1 GARNET against unchanged ZEN
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 700101 --seed-p2 700202 \
            --reference-python "$PY310" --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --adapter-dir-p1 runs/valence-smoke/garnet-g1-adapter \
            --adapter-dir-p2 data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 --games 1 --expected-rounds 1 --timeout 900 \
            --run-id valence-after --out runs/valence-smoke

      - name: Audit generation isolation
        run: |
          python - <<'PY'
          import json
          before=json.load(open('runs/valence-smoke/valence-before/status.json'))
          after=json.load(open('runs/valence-smoke/valence-after/status.json'))
          update=json.load(open('runs/valence-smoke/garnet-update.json'))
          p=after['character_adapters']
          assert before['status']=='COMPLETED_WITH_VALIDATED_CANONICAL_TRACES'
          assert after['status']=='COMPLETED_WITH_VALIDATED_CANONICAL_TRACES'
          assert p[0]['character']=='GARNET' and p[0]['plasticity']['generation']==1
          assert p[0]['plasticity']['model']=='KC-MBON-valence-depression-v0'
          assert p[1]['character']=='ZEN' and not p[1]['plasticity']
          assert update['updates']['potentiated_edges']==0
          print(json.dumps({'PASS':True,'before':before['audit']['rounds'],'after':after['audit']['rounds'],'GARNET':p[0]['plasticity'],'ZEN':p[1]['plasticity']},indent=2))
          PY

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/valence-smoke/fightingice.pid ]; then kill "$(cat runs/valence-smoke/fightingice.pid)" 2>/dev/null || true; fi

      - name: Upload compact smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-valence-plasticity-smoke
          path: |
            runs/valence-smoke/garnet-update.json
            runs/valence-smoke/state/GARNET.npz
            runs/valence-smoke/state/GARNET.npz.json
            runs/valence-smoke/garnet-g1-adapter/manifest.json
            runs/valence-smoke/valence-before/status.json
            runs/valence-smoke/valence-after/status.json
            runs/valence-smoke/fightingice.log
          if-no-files-found: warn
          retention-days: 30
