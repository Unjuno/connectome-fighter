name: canonical-continuous-training

# Single-writer candidate-learning lane.
# This workflow advances a rolling GARNET research checkpoint on GitHub only.
# It never writes weights on Vercel and never auto-promotes candidate state to
# arena-inference-latest. Promotion remains a separate evidence gate.
on:
  workflow_dispatch:
  schedule:
    - cron: '53 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-training.yml'

permissions:
  contents: write

concurrency:
  group: canonical-continuous-training-single-writer
  cancel-in-progress: false

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  VALENCE_CACHE_KEY: malecns-v1.0-kc-mbon-valence-v1
  TRAINING_TAG: canonical-training-latest
  SEED_TAG: canonical-state-smoke-v1
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  train-one-match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore the latest candidate checkpoint or the approved G2 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runs/continuous-training
          mkdir -p runs/continuous-training/source runs/continuous-training/checkpoint

          if gh release view "$TRAINING_TAG" >/dev/null 2>&1; then
            source_kind='rolling-candidate'
            archive='garnet-training-latest.tar.gz'
            checksum='garnet-training-latest.tar.gz.sha256'
            source_tag="$TRAINING_TAG"
          else
            source_kind='approved-g2-seed'
            archive='garnet-g2.tar.gz'
            checksum='garnet-g2.tar.gz.sha256'
            source_tag="$SEED_TAG"
          fi

          gh release download "$source_tag" \
            --pattern "$archive" \
            --pattern "$checksum" \
            --dir runs/continuous-training/source

          expected="$(grep -Eo '[a-f0-9]{64}' "runs/continuous-training/source/$checksum" | head -1)"
          test -n "$expected"
          actual="$(sha256sum "runs/continuous-training/source/$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -C runs/continuous-training/checkpoint -xzf "runs/continuous-training/source/$archive"

          python - <<'PY'
          import hashlib, json, pathlib
          state=pathlib.Path('runs/continuous-training/checkpoint/state/GARNET.npz')
          meta=json.load(open(str(state)+'.json',encoding='utf-8'))
          sha=hashlib.sha256(state.read_bytes()).hexdigest()
          assert meta['state_sha256']==sha
          assert meta['character']=='GARNET'
          assert meta['model']=='KC-MBON-valence-depression-v0'
          assert meta['reward_id']=='R2d-v0'
          assert int(meta['generation'])>=2
          print(json.dumps({'restore_verified':True,'generation':meta['generation'],'matches':meta['matches'],'state_sha256':sha},indent=2))
          PY
          echo "SOURCE_KIND=$source_kind" >> "$GITHUB_ENV"

      - name: Choose the bounded training opponent
        run: |
          set -euo pipefail
          case $((GITHUB_RUN_NUMBER % 3)) in
            0) opponent='ZEN'; seed2=20202 ;;
            1) opponent='LUD'; seed2=30303 ;;
            2) opponent='NEZ'; seed2=40404 ;;
          esac
          echo "OPPONENT=$opponent" >> "$GITHUB_ENV"
          echo "OPPONENT_SEED=$seed2" >> "$GITHUB_ENV"
          printf 'candidate=GARNET opponent=%s\n' "$opponent"

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.24.0' 'pandas==1.5.3' 'pyarrow==10.0.1' 'joblib==1.2.0' 'Cython==0.29.36' 'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"

      - name: Set up bridge/update Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge/update dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==23.0.1' 'pyftg==2.3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore canonical valence partition cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-valence-v1
          key: ${{ env.VALENCE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build the fixed game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 --decision-window-ms 20 --neutral-min-spikes 1

      - name: Materialize the restored candidate as a runtime adapter
        run: |
          PYTHONPATH=src python scripts/materialize_malecns_valence_adapter.py \
            --base-adapter data/processed/malecns-shiu-strict-v1 \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --state runs/continuous-training/checkpoint/state/GARNET.npz \
            --character GARNET \
            --plasticity-config configs/plasticity_valence_v0.json \
            --out runs/continuous-training/garnet-adapter

      - name: Fetch the pinned Shiu model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 -o external/shiu-reference/model.py "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713
      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Start one bounded FightingICE training match
        run: |
          set -euo pipefail
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          mkdir -p runs/continuous-training/match
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/continuous-training/match/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/continuous-training/match/fightingice.pid"
          )
          for i in $(seq 1 90); do
            grep -q 'Socket server is started' runs/continuous-training/match/fightingice.log 2>/dev/null && exit 0
            kill -0 "$(cat runs/continuous-training/match/fightingice.pid)" 2>/dev/null || {
              tail -120 runs/continuous-training/match/fightingice.log >&2 || true
              exit 1
            }
            sleep 1
          done
          exit 1

      - name: Run the restored candidate against the rotating baseline opponent
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 "$OPPONENT" \
            --seed-p1 800101 --seed-p2 "$OPPONENT_SEED" \
            --reference-python "$PY310" --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --adapter-dir-p1 runs/continuous-training/garnet-adapter \
            --adapter-dir-p2 data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 --games 1 --expected-rounds 1 --timeout 900 \
            --trainable-trace --run-id candidate-match --out runs/continuous-training/match

      - name: Apply the audited reward/plasticity update to the candidate only
        run: |
          PYTHONPATH=src python scripts/update_malecns_valence_plasticity.py \
            --character GARNET --side 1 \
            --round-trace runs/continuous-training/match/candidate-match/p1.jsonl \
            --spikes runs/continuous-training/match/candidate-match/p1-brain/spikes.parquet \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --reward-config configs/reward_r2d_v0.json \
            --plasticity-config configs/plasticity_valence_v0.json \
            --state runs/continuous-training/checkpoint/state/GARNET.npz \
            --out-summary runs/continuous-training/update.json
          python - <<'PY'
          import json
          u=json.load(open('runs/continuous-training/update.json',encoding='utf-8'))
          assert u['status']=='PASS'
          assert u['state_source']=='checkpoint'
          assert u['updates']['potentiated_edges']==0
          assert u['invariants']['topology_changed'] is False
          assert u['invariants']['sign_changed'] is False
          print(json.dumps({'candidate_generation':u['state']['generation'],'matches':u['state']['matches'],'signals':u['signals'],'updates':u['updates']},indent=2))
          PY

      - name: Package the next rolling candidate and public training status
        run: |
          set -euo pipefail
          mkdir -p runs/continuous-training/package/state runs/continuous-training/package/evidence site/data
          cp runs/continuous-training/checkpoint/state/GARNET.npz runs/continuous-training/package/state/GARNET.npz
          cp runs/continuous-training/checkpoint/state/GARNET.npz.json runs/continuous-training/package/state/GARNET.npz.json
          cp runs/continuous-training/update.json runs/continuous-training/package/evidence/update.json
          cp runs/continuous-training/match/candidate-match/status.json runs/continuous-training/package/evidence/match-status.json
          python - <<'PY'
          import hashlib,json,os,pathlib
          from datetime import datetime, timezone
          state=pathlib.Path('runs/continuous-training/package/state/GARNET.npz')
          meta=json.load(open(str(state)+'.json',encoding='utf-8'))
          update=json.load(open('runs/continuous-training/update.json',encoding='utf-8'))
          match=json.load(open('runs/continuous-training/match/candidate-match/status.json',encoding='utf-8'))
          sha=hashlib.sha256(state.read_bytes()).hexdigest()
          assert meta['state_sha256']==sha
          manifest={
            'schema_version':1,
            'kind':'canonical-continuous-training-candidate',
            'status':'candidate-only-not-arena-approved',
            'character':'GARNET',
            'generation':int(meta['generation']),
            'matches':int(meta['matches']),
            'state_sha256':sha,
            'model':meta['model'],
            'reward_id':meta['reward_id'],
            'opponent':os.environ['OPPONENT'],
            'source_kind':os.environ['SOURCE_KIND'],
            'source_run_url':f"https://github.com/Unjuno/connectome-fighter/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            'served_by_vercel':False,
            'auto_promotion':False,
          }
          pathlib.Path('runs/continuous-training/package/training-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          status={
            **manifest,
            'updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'match_status':match.get('status'),
            'signal_summary':update['signals'],
            'update_summary':update['updates'],
            'interpretation_boundary':update['interpretation_boundary'],
          }
          pathlib.Path('site/data/training-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(status,indent=2,sort_keys=True))
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf runs/continuous-training/garnet-training-latest.tar.gz \
            -C runs/continuous-training/package .
          (cd runs/continuous-training && sha256sum garnet-training-latest.tar.gz > garnet-training-latest.tar.gz.sha256)

      - name: Publish the rolling candidate checkpoint without promoting it to LIVE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TRAINING_TAG" >/dev/null 2>&1; then
            gh release create "$TRAINING_TAG" --prerelease \
              --title 'Canonical rolling training candidate' \
              --notes 'Single-writer research candidate. Never served by Vercel unless separately validated and promoted.'
          fi
          gh release upload "$TRAINING_TAG" \
            runs/continuous-training/garnet-training-latest.tar.gz \
            runs/continuous-training/garnet-training-latest.tar.gz.sha256 \
            runs/continuous-training/package/training-manifest.json \
            --clobber

      - name: Publish candidate-learning status to the research ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/training-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update rolling candidate training status [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/continuous-training/match/fightingice.pid ]; then
            kill "$(cat runs/continuous-training/match/fightingice.pid)" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-candidate-training-evidence
          path: |
            runs/continuous-training/update.json
            runs/continuous-training/package/training-manifest.json
            runs/continuous-training/garnet-training-latest.tar.gz.sha256
            runs/continuous-training/match/candidate-match/status.json
            site/data/training-status.json
          if-no-files-found: warn
          retention-days: 30
