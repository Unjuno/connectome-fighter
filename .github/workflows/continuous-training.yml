name: canonical-continuous-training

# Canonical sequential trainer.
# Exactly one training run is allowed at a time. A successful run dispatches
# the next run, so training continues without parallel MaleCNS jobs.
# Set repository variable CANONICAL_TRAINING_ENABLED=false to stop the chain.

on:
  workflow_dispatch:
    inputs:
      matches_per_run:
        description: Sequential matches to execute before checkpointing
        required: false
        default: '3'
      character:
        description: Character lineage to train (currently GARNET is the proven resume lineage)
        required: false
        default: 'GARNET'

permissions:
  contents: write
  actions: write

concurrency:
  group: canonical-continuous-training
  cancel-in-progress: false

jobs:
  train:
    if: ${{ vars.CANONICAL_TRAINING_ENABLED != 'false' }}
    uses: ./.github/workflows/canonical-checkpoint-resume.yml
    with:
      continuous_mode: true
      matches_per_run: ${{ inputs.matches_per_run || '3' }}
      character: ${{ inputs.character || 'GARNET' }}
    secrets: inherit

  continue:
    needs: train
    if: ${{ needs.train.result == 'success' && vars.CANONICAL_TRAINING_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next sequential training run
        env:
          GH_TOKEN: ${{ github.token }}
          MATCHES_PER_RUN: ${{ inputs.matches_per_run || '3' }}
          CHARACTER: ${{ inputs.character || 'GARNET' }}
        run: |
          gh workflow run continuous-training.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f matches_per_run="$MATCHES_PER_RUN" \
            -f character="$CHARACTER"
