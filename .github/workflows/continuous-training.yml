name: continuous-training-legacy-paused

# PAUSED ON PURPOSE.
# The previous scheduled trainer used FlyWire v783 plus a custom sigmoid
# recurrent scaffold. That is not the canonical substrate requested for this
# project. Automatic training stays disabled until the MaleCNS v1.0 +
# published-LIF control path passes provenance and integration gates.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain pause
        run: |
          cat <<'EOF'
          Legacy continuous training is paused.

          Canonical target:
            anatomy: FlyEM/Janelia/Cambridge/MRC LMB/Google Research MaleCNS v1.0
            dynamics: published Drosophila LIF model, explicitly separated from anatomy
            no custom sigmoid/RNN/MLP brain in the canonical control path

          The old `training-state` release is legacy evidence only and MUST NOT
          be resumed as a canonical MaleCNS lineage.
          EOF
