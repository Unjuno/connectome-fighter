name: canonical-continuous-training

# Canonical sequential trainer control surface.
# This workflow is intentionally NOT parallel. It is a dispatcher/guard for
# one-at-a-time MaleCNS training. The actual continuous trainer is introduced
# separately after its latest-checkpoint contract is verified.
#
# IMPORTANT: the legacy FlyWire/custom-RNN trainer remains retired.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-continuous-training
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current continuous-training gate
        run: |
          cat <<'EOF'
          Sequential canonical training is being migrated to a latest-checkpoint
          chain. Do not reuse canonical-checkpoint-resume.yml as a loop: it is a
          fixed G1 -> G2 resume proof, not a generic trainer.

          Required continuous contract:
            1. exactly one runner at a time
            2. restore latest verified canonical checkpoint
            3. run one bounded training unit
            4. atomically publish generation N+1
            5. dispatch the next run only after successful publication
            6. stop cleanly via repository control flag
          EOF
