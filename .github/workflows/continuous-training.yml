name: paired-candidate-training

# Replaces the R2e recurring writer. Requests are not completed-update promises.
on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-training.yml'
  pull_request:
    paths:
      - '.github/workflows/continuous-training.yml'
      - 'scripts/paired_*.py'
      - 'src/connectome_fighter/paired_*.py'
      - 'tests/test_paired_*.py'
      - 'tests/test_combat_schedule.py'
      - 'app/api/evaluation/**'
      - 'app/training/**'
      - 'lib/paired-view.ts'

permissions:
  contents: read
concurrency:
  group: canonical-continuous-training-single-writer
  cancel-in-progress: false

env:
  CI: 'true'
  RUNTIME_ROOT: /home/vercel-sandbox/connectome-runtime/arena-runtime
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CONNECTOME_TRAINING_PAUSED: ${{ vars.CONNECTOME_TRAINING_PAUSED }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test rewards, checkpoint continuity, publication and scheduler isolation
        run: |
          python -m pip install 'numpy==1.26.4' 'pytest==8.3.5' 'PyYAML==6.0.2'
          PYTHONPATH=src python -m pytest -q tests/test_paired_search.py tests/test_paired_rollout.py tests/test_paired_publication.py tests/test_combat_schedule.py
      - name: Validate actual public app and paired-envelope rejection
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npx tsc lib/paired-view.ts --target es2022 --module commonjs --outDir runs/view-contract --skipLibCheck
          node scripts/test_paired_view.cjs

  train-and-evaluate:
    needs: contract
    if: vars.CONNECTOME_TRAINING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency verifier and actual renderer dependencies
        run: |
          python -m pip install 'numpy==1.26.4'
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fontconfig fonts-dejavu-core ffmpeg
      - name: Resume exact published paired state or explicitly fork the R2e seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/paired_rollout_io.py fetch --out runs/paired-rollout
          sudo mkdir -p "$(dirname "$RUNTIME_ROOT")"
          sudo chown -R "$(id -u):$(id -g)" /home/vercel-sandbox
          tar -xzf runs/paired-rollout/runtime.tar.gz -C "$(dirname "$RUNTIME_ROOT")"
          lscpu > runs/paired-rollout/cpu.txt
          ffmpeg -version > runs/paired-rollout/ffmpeg-version.txt
          git rev-parse HEAD > runs/paired-rollout/tested-checkout.txt
      - name: Real paired search, independent selection and recorded frozen combat
        run: |
          set -euo pipefail
          BRIDGE="$RUNTIME_ROOT/$(cat "$RUNTIME_ROOT/runtime/python311.path")"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$RUNTIME_ROOT/runtime/site311" \
            "$BRIDGE" scripts/paired_search_experiment.py \
            --runtime-root "$RUNTIME_ROOT" --source-archive runs/paired-rollout/source.tar.gz \
            --out runs/paired-rollout --timeout-seconds 1800 --persistent
          python scripts/paired_rollout_io.py package --out runs/paired-rollout
      - uses: actions/upload-artifact@v4
        with:
          name: paired-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/paired-rollout/publish
          if-no-files-found: error
          retention-days: 3
      - name: Preserve tested source even after a failed game
        if: always()
        run: |
          mkdir -p runs/paired-rollout/tested-source
          cp scripts/paired_*.py src/connectome_fighter/paired_*.py runs/paired-rollout/tested-source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-cycle-evidence
          retention-days: 3
          if-no-files-found: error
          path: |
            runs/paired-rollout/result.json
            runs/paired-rollout/design.json
            runs/paired-rollout/dependencies.json
            runs/paired-rollout/matches-summary.json
            runs/paired-rollout/baseline-repeatability.json
            runs/paired-rollout/candidate
            runs/paired-rollout/tested-source
            runs/paired-rollout/*.log
            runs/paired-rollout/*.txt
            runs/paired-rollout/matches

  publish:
    needs: train-and-evaluate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CONNECTOME_TRAINING_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4'
      - uses: actions/download-artifact@v4
        with:
          name: paired-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/paired-publication
      - name: Upload immutable evidence, then advance one coherent public record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/paired_rollout_io.py publish --out runs/paired-publication
