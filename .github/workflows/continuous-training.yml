name: combat-candidate-training

# Bounded self-chaining research lane. A successful main run requests one next run
# after a two-minute hold; hourly cron is only a watchdog because GitHub schedules
# are best-effort and can be delayed or dropped. This is NOT guaranteed throughput.
# One writer, bounded work, full-round traces, paired frozen before/after video.
# The scheduled P1 controller uses the versioned readout declared by combat_training_run.py; current mode is ema-residual.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-training.yml'
  pull_request:
    paths:
      - '.github/workflows/continuous-training.yml'
      - 'scripts/combat_training_run.py'
      - 'scripts/fetch_combat_dependencies.py'
      - 'scripts/publish_combat_candidate.py'
      - 'scripts/publish_combat_view.py'
      - 'scripts/update_malecns_valence_plasticity.py'
      - 'src/connectome_fighter/combat_*.py'
      - 'configs/reward_r2e_combat_v1.json'
      - 'configs/plasticity_combat_v1.json'
      - 'tests/test_combat_*.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('combat-training-pr-{0}', github.event.pull_request.number) || 'canonical-continuous-training-single-writer' }}
  cancel-in-progress: false

env:
  TRAINING_TAG: combat-training-v1
  SEED_TAG: canonical-training-latest
  CI: 'true'
  RUNTIME_ROOT: /home/vercel-sandbox/connectome-runtime/arena-runtime
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4' 'pytest==8.3.5' 'PyYAML==6.0.2'
      - run: PYTHONPATH=src python -m pytest -q tests/test_combat_reward.py tests/test_combat_checkpoint.py tests/test_combat_schedule.py tests/test_combat_publication.py

  train-and-evaluate:
    needs: contract
    outputs:
      accepted_update: ${{ steps.acceptance.outputs.accepted_update }}
    if: vars.CONNECTOME_TRAINING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official-renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fontconfig fonts-dejavu-core ffmpeg
      - name: Pin and verify runtime and candidate asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_combat_dependencies.py --out runs/combat
          sudo mkdir -p "$(dirname "$RUNTIME_ROOT")"
          sudo chown -R "$(id -u):$(id -g)" /home/vercel-sandbox
          tar -xzf runs/combat/runtime.tar.gz -C "$(dirname "$RUNTIME_ROOT")"
          lscpu > runs/combat/cpu.txt
          python --version > runs/combat/python-version.txt
          ffmpeg -version > runs/combat/ffmpeg-version.txt
      - name: Real frozen baseline, full training round, and frozen updated evaluation
        run: |
          python scripts/combat_training_run.py --runtime-root "$RUNTIME_ROOT" --source-archive runs/combat/source.tar.gz --out runs/combat --timeout-seconds 1050
      - name: Read strict paired acceptance decision
        id: acceptance
        run: |
          echo "accepted_update=$(python -c "import json; print(str(bool(json.load(open('runs/combat/result.json')).get('accepted_update'))).lower())")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.acceptance.outputs.accepted_update == 'true'
        with:
          name: combat-candidate-publication-${{ github.run_id }}
          path: runs/combat/publish
          retention-days: 3
          if-no-files-found: error
      - name: Save bounded experiment evidence
        if: always()
        run: |
          mkdir -p runs/combat/evidence
          cp scripts/combat_training_run.py scripts/fetch_combat_dependencies.py scripts/publish_combat_candidate.py configs/reward_r2e_combat_v1.json configs/plasticity_combat_v1.json runs/combat/evidence/
          git rev-parse HEAD > runs/combat/evidence/tested-checkout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-training-evidence
          retention-days: 3
          path: |
            runs/combat/result.json
            runs/combat/environment.json
            runs/combat/asset-audit.json
            runs/combat/dependencies.json
            runs/combat/update.json
            runs/combat/acceptance.json
            runs/combat/*.log
            runs/combat/*.txt
            runs/combat/evidence
            runs/combat/checkpoint
            runs/combat/package/parent.json
            runs/combat/matches/*/status.json
            runs/combat/matches/*/p1.jsonl
            runs/combat/matches/*/p2.jsonl
            runs/combat/matches/*/p1-brain/*
            runs/combat/matches/*/p2-brain/*

  publish:
    needs: train-and-evaluate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CONNECTOME_TRAINING_PAUSED != 'true' && needs.train-and-evaluate.outputs.accepted_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: combat-candidate-publication-${{ github.run_id }}
          path: runs/publication
      - name: Publish verified candidate and run-addressed videos, never approved inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_combat_candidate.py --input runs/publication
      - name: Atomically expose paired evaluations and training history
        run: python scripts/publish_combat_view.py --input runs/publication


  continue-loop:
    needs: [train-and-evaluate, publish]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.CONNECTOME_TRAINING_PAUSED != 'true' &&
      needs.train-and-evaluate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Hold before requesting the next bounded training run
        run: sleep 120
      - name: Dispatch only when no sibling run is already queued or active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='continuous-training.yml'
          sibling="$(
            {
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=queued&per_page=100" \
                --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id"
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=in_progress&per_page=100" \
                --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id"
            } | head -n 1
          )"
          if [ -n "$sibling" ]; then
            echo "A sibling combat-training run already exists: $sibling"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main
          echo "Requested exactly one next main-branch training run."
