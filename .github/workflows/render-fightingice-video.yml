name: render-fightingice-video

on:
  workflow_dispatch:
  workflow_run:
    workflows: [malecns-baseline-batch]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-fightingice-video.yml'
      - 'site/index.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rendered-fightingice-screen-v1
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fast-forward to latest dashboard data
        run: git pull --ff-only origin main

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.24.0' 'pandas==1.5.3' 'pyarrow==10.0.1' \
            'joblib==1.2.0' 'Cython==0.29.36' 'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"

      - name: Set up bridge Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bridge dependencies and recorder
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==23.0.1' 'pyftg==2.3'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build fixed game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 \
            --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 \
            --decision-window-ms 20 \
            --neutral-min-spikes 1

      - name: Fetch pinned Shiu reference model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 -o external/shiu-reference/model.py \
            "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713

      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Start headless FightingICE with official renderer
        run: |
          mkdir -p runs/rendered site/data
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 \
              --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/rendered/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/rendered/fightingice.pid"
          )
          ready=0
          for i in $(seq 1 90); do
            if grep -q 'Socket server is started' runs/rendered/fightingice.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$(cat runs/rendered/fightingice.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          cat runs/rendered/fightingice.log || true
          test "$ready" -eq 1

      - name: Run canonical fight and capture official ScreenData
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 10101 --seed-p2 20202 \
            --reference-python "$PY310" \
            --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 \
            --games 1 --expected-rounds 1 --timeout 900 \
            --spectator-video site/data/latest-fight.mp4 \
            --spectator-fps 60 \
            --run-id rendered-garnet-zen \
            --out runs/rendered
          test -s site/data/latest-fight.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name \
            -of json site/data/latest-fight.mp4 | tee runs/rendered/video-probe.json
          python - <<'PY'
          import json
          p=json.load(open('runs/rendered/video-probe.json'))
          s=p['streams'][0]
          duration=float(p['format']['duration'])
          size=int(p['format']['size'])
          assert s['codec_name']=='h264', s
          assert int(s['width'])==960 and int(s['height'])==640, s
          assert duration > 2.0, duration
          assert size > 10000, size
          print('official ScreenData video OK', duration, size)
          PY
          ffmpeg -y -loglevel error -ss 1 -i site/data/latest-fight.mp4 -frames:v 1 runs/rendered/sample-frame.png
          test -s runs/rendered/sample-frame.png

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/rendered/fightingice.pid ]; then
            kill "$(cat runs/rendered/fightingice.pid)" 2>/dev/null || true
          fi

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-fightingice-spectator
          path: |
            site/data/latest-fight.mp4
            runs/rendered/video-probe.json
            runs/rendered/sample-frame.png
            runs/rendered/fightingice.log
            runs/rendered/rendered-garnet-zen/status.json
            runs/rendered/rendered-garnet-zen/spectator.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard with real FightingICE video
        id: deployment
        uses: actions/deploy-pages@v4
