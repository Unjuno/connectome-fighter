name: render-fightingice-video

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-fightingice-video.yml'
      - 'scripts/build_spectator_queue.py'
      - 'scripts/build_malecns_skeleton_projection.py'
      - 'scripts/enrich_spectator_queue_morphology.py'

permissions:
  contents: write

concurrency:
  group: rendered-fightingice-screen-v3
  cancel-in-progress: false

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  STRUCTURE_CACHE_KEY: malecns-v1.0-structure-index-v1
  SPECTATOR_RELEASE_TAG: spectator-latest
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fast-forward to latest public data
        run: git pull --ff-only origin main

      - name: Choose rotating matchup and next expected clip time
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import json, os, re
          pairs=[
            ('GARNET','ZEN',10101,20202),
            ('GARNET','LUD',10101,30303),
            ('GARNET','NEZ',10101,40404),
            ('ZEN','LUD',20202,30303),
            ('ZEN','NEZ',20202,40404),
            ('LUD','NEZ',30303,40404),
          ]
          now=datetime.now(timezone.utc)
          run_number=max(1,int(os.environ.get('GITHUB_RUN_NUMBER','1')))
          slot=(run_number-1)%len(pairs)
          epoch=(run_number-1)//len(pairs)
          p1,p2,base_s1,base_s2=pairs[slot]
          seed_offset=epoch*1_000_000
          s1=base_s1+seed_offset
          s2=base_s2+seed_offset
          nxt=now.replace(minute=17,second=0,microsecond=0)
          if nxt <= now:
              nxt += timedelta(hours=1)
          run_id=f"spectator-e{epoch}-{slot}-{p1.lower()}-{p2.lower()}-{os.environ['GITHUB_RUN_ID']}"
          run_id=re.sub(r'[^a-z0-9_-]+','-',run_id)[:64]
          values={
            'SPECTATOR_P1':p1,'SPECTATOR_P2':p2,
            'SPECTATOR_SEED1':s1,'SPECTATOR_SEED2':s2,
            'SPECTATOR_RUN_ID':run_id,
            'SPECTATOR_SLOT':slot,
            'SPECTATOR_EPOCH':epoch,
            'NEXT_EXPECTED_AT':nxt.isoformat(),
          }
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in values.items(): f.write(f'{k}={v}\n')
          print(json.dumps(values,indent=2))
          PY

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.24.0' 'pandas==1.5.3' 'pyarrow==10.0.1' 'joblib==1.2.0' 'Cython==0.29.36' 'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"

      - name: Set up bridge Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge dependencies and recorder
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==23.0.1' 'pyftg==2.3'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore spectator structural annotations
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-structure-v1
          key: ${{ env.STRUCTURE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build fixed game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 --decision-window-ms 20 --neutral-min-spikes 1

      - name: Fetch pinned Shiu reference model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 -o external/shiu-reference/model.py \
            "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713
      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Restore previous spectator queue and videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/previous
          if ! gh release view "$SPECTATOR_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$SPECTATOR_RELEASE_TAG" --prerelease \
              --title 'Connectome Fighter rolling spectator' \
              --notes 'Rolling spectator assets for the Vercel viewer. No learning state is stored here.'
          fi
          gh release download "$SPECTATOR_RELEASE_TAG" -p queue.json -D runs/previous --clobber || true
          gh release download "$SPECTATOR_RELEASE_TAG" -p latest-fight.mp4 -D runs/previous --clobber || true
          gh release download "$SPECTATOR_RELEASE_TAG" -p previous-1.mp4 -D runs/previous --clobber || true

      - name: Start headless FightingICE with official renderer
        run: |
          mkdir -p runs/rendered
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 \
              --port 31415 -r 6 -f 600 \
              > "$GITHUB_WORKSPACE/runs/rendered/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/rendered/fightingice.pid"
          )
          for i in $(seq 1 90); do
            grep -q 'Socket server is started' runs/rendered/fightingice.log 2>/dev/null && exit 0
            kill -0 "$(cat runs/rendered/fightingice.pid)" 2>/dev/null || exit 1
            sleep 1
          done
          exit 1

      - name: Run six canonical rounds and capture one-minute ScreenData clip
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 "$SPECTATOR_P1" --character-p2 "$SPECTATOR_P2" \
            --seed-p1 "$SPECTATOR_SEED1" --seed-p2 "$SPECTATOR_SEED2" \
            --reference-python "$PY310" --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 --games 1 --expected-rounds 6 --timeout 1800 \
            --spectator-video runs/rendered/latest-fight.mp4 --spectator-fps 10 \
            --run-id "$SPECTATOR_RUN_ID" --out runs/rendered
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name \
            -of json runs/rendered/latest-fight.mp4 | tee runs/rendered/video-probe.json
          python - <<'PY'
          import json, os, pathlib
          probe=json.load(open('runs/rendered/video-probe.json'))
          stream=probe['streams'][0]
          duration=float(probe['format']['duration']); size=int(probe['format']['size'])
          assert stream['codec_name']=='h264'
          assert int(stream['width'])==960 and int(stream['height'])==640
          assert 45.0 < duration < 100.0, duration
          assert size > 10000, size
          spectator=json.load(open(f"runs/rendered/{os.environ['SPECTATOR_RUN_ID']}/spectator.json"))
          video={
              'schema_version':4,
              'mode':'official-fightingice-screendata-spectator',
              'asset_url':'https://github.com/Unjuno/connectome-fighter/releases/download/spectator-latest/latest-fight.mp4',
              'p1':{'character':os.environ['SPECTATOR_P1'],'seed':int(os.environ['SPECTATOR_SEED1'])},
              'p2':{'character':os.environ['SPECTATOR_P2'],'seed':int(os.environ['SPECTATOR_SEED2'])},
              'rounds':6,
              'policy_pixel_access':False,
              'width':int(stream['width']),'height':int(stream['height']),
              'fps':int(spectator['fps']),'frames':int(spectator['frames']),
              'duration_seconds':duration,'bytes':size,
              'source_actions_run':int(os.environ['GITHUB_RUN_ID']),
          }
          pathlib.Path('runs/rendered/video.json').write_text(json.dumps(video,indent=2,sort_keys=True)+'\n')
          print(json.dumps(video,indent=2))
          PY

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/rendered/fightingice.pid ]; then kill "$(cat runs/rendered/fightingice.pid)" 2>/dev/null || true; fi

      - name: Build released MaleCNS morphology projection
        run: |
          python scripts/build_malecns_skeleton_projection.py \
            --run-dir "runs/rendered/$SPECTATOR_RUN_ID" \
            --out runs/rendered/morphology.json \
            --bodies-per-side 6 \
            --max-segments-per-body 180

      - name: Rotate old clips and build rolling queue
        run: |
          if [ -s runs/previous/latest-fight.mp4 ]; then cp runs/previous/latest-fight.mp4 runs/rendered/previous-1.mp4; fi
          if [ -s runs/previous/previous-1.mp4 ]; then cp runs/previous/previous-1.mp4 runs/rendered/previous-2.mp4; fi
          python scripts/build_spectator_queue.py \
            --run-dir "runs/rendered/$SPECTATOR_RUN_ID" \
            --structure-index data/processed/malecns-structure-v1/body_structure.csv.gz \
            --video-meta runs/rendered/video.json \
            --previous-queue runs/previous/queue.json \
            --out runs/rendered/queue.json \
            --public-base "https://github.com/${{ github.repository }}/releases/download/$SPECTATOR_RELEASE_TAG/" \
            --source-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --next-expected-at "$NEXT_EXPECTED_AT"
          python scripts/enrich_spectator_queue_morphology.py \
            --queue runs/rendered/queue.json \
            --morphology runs/rendered/morphology.json

      - name: Publish rolling release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(runs/rendered/latest-fight.mp4 runs/rendered/video.json runs/rendered/queue.json)
          [ -s runs/rendered/previous-1.mp4 ] && files+=(runs/rendered/previous-1.mp4)
          [ -s runs/rendered/previous-2.mp4 ] && files+=(runs/rendered/previous-2.mp4)
          gh release upload "$SPECTATOR_RELEASE_TAG" "${files[@]}" --clobber

      - name: Persist queue metadata for Vercel polling
        run: |
          mkdir -p site/data
          cp runs/rendered/video.json site/data/video.json
          cp runs/rendered/queue.json site/data/queue.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --ff-only origin main
          cp runs/rendered/video.json site/data/video.json
          cp runs/rendered/queue.json site/data/queue.json
          git add site/data/video.json site/data/queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling spectator queue [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-fightingice-spectator
          path: |
            runs/rendered/video.json
            runs/rendered/queue.json
            runs/rendered/morphology.json
            runs/rendered/video-probe.json
            runs/rendered/fightingice.log
            runs/rendered/*/status.json
            runs/rendered/*/spectator.json
          if-no-files-found: warn
          retention-days: 14
