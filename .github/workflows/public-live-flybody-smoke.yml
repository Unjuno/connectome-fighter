name: public-live-flybody-smoke

on:
  pull_request:
    paths:
      - 'scripts/verify_live_flybody.py'
      - 'tests/test_flybody_serving_proof.py'
      - '.github/workflows/public-live-flybody-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_live_flybody.py'
      - 'tests/test_flybody_serving_proof.py'
      - '.github/workflows/public-live-flybody-smoke.yml'
  workflow_dispatch:
    inputs:
      base_url:
        required: false
        type: string
  workflow_run:
    workflows: [publish-flybody-runtime-addon]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-live-flybody-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate proof reader with engineering fixtures (no network)
        run: |
          mkdir -p runs/flybody-serving-contract
          set -o pipefail
          python -m unittest discover -s tests -p test_flybody_serving_proof.py -v 2>&1 | tee runs/flybody-serving-contract/tests.txt
          python -m py_compile scripts/verify_live_flybody.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flybody-serving-contract-evidence
          path: runs/flybody-serving-contract

  flybody:
    needs: contract
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && ((github.event_name == 'workflow_dispatch' && inputs.base_url != '') || vars.CONNECTOME_PUBLIC_BASE_URL != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: ${{ inputs.base_url || vars.CONNECTOME_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require two progressing hash-bound neural and physical snapshots
        run: python scripts/verify_live_flybody.py --base-url "$BASE" --max-seconds 180 --output runs/flybody-serving-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flybody-public-serving-evidence
          path: runs/flybody-serving-proof
