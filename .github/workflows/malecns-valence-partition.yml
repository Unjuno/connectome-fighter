name: malecns-valence-partition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_malecns_valence_partition.py'
      - '.github/workflows/malecns-valence-partition.yml'

permissions:
  contents: read

concurrency:
  group: malecns-valence-partition
  cancel-in-progress: true

env:
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  VALENCE_CACHE_KEY: malecns-v1.0-kc-mbon-valence-v1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pyarrow>=16,<24'
      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Restore or save valence partition cache
        id: valence-cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-valence-v1
          key: ${{ env.VALENCE_CACHE_KEY }}
      - name: Partition anatomically existing KC-to-MBON edges
        if: steps.valence-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf data/processed/malecns-valence-v1
          python scripts/build_malecns_valence_partition.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --connectivity data/processed/malecns-shiu-strict-v1/connectivity.parquet \
            --adapter-manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out-dir data/processed/malecns-valence-v1
      - name: Validate partition invariants
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='data/processed/malecns-valence-v1'
          m=json.load(open(f'{root}/manifest.json'))
          c=pd.read_parquet(f'{root}/kc_mbon_valence_candidates.parquet')
          assert m['invariants']['topology_changed'] is False
          assert m['invariants']['weights_changed'] is False
          assert m['invariants']['signs_changed'] is False
          assert m['invariants']['learning_applied'] is False
          assert len(c)==33496, len(c)
          assert (c['sign']==1).all()
          assert set(c['mbon_valence_channel']).issubset({'approach_associated','avoidance_associated','unresolved'})
          assert 'unresolved' not in set(c['mbon_valence_channel'])
          print(json.dumps(m['counts'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: malecns-valence-partition-v1
          path: |
            data/processed/malecns-valence-v1/manifest.json
            data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet
          if-no-files-found: error
          retention-days: 30
