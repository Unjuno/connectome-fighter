name: candidate-training-history

on:
  workflow_run:
    workflows: [canonical-continuous-training]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-training-history-single-writer
  cancel-in-progress: false

jobs:
  append:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Append the latest verified candidate state to the public history
        run: |
          set -euo pipefail
          python scripts/append_training_history.py \
            --status site/data/training-status.json \
            --history site/data/training-history.json

      - name: Commit only the append-only research ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/training-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Append candidate training history [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1
