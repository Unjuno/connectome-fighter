name: continuous-training-contract

on:
  pull_request:
    paths:
      - '.github/workflows/continuous-training.yml'
      - '.github/workflows/continuous-training-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-training.yml'
      - '.github/workflows/continuous-training-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse workflow and verify the candidate-only single-writer boundary
        run: |
          python -m pip install --quiet 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml

          path=Path('.github/workflows/continuous-training.yml')
          text=path.read_text(encoding='utf-8')
          data=yaml.safe_load(text)
          assert isinstance(data,dict) and data.get('name')=='canonical-continuous-training'

          required=[
              "cron: '53 */6 * * *'",
              'group: canonical-continuous-training-single-writer',
              'cancel-in-progress: false',
              'TRAINING_TAG: canonical-training-latest',
              'SEED_TAG: canonical-state-smoke-v1',
              "'status':'candidate-only-not-arena-approved'",
              "'served_by_vercel':False",
              "'auto_promotion':False",
              '--reward-config configs/reward_r2d_v0.json',
              '--plasticity-config configs/plasticity_valence_v0.json',
              'git add site/data/training-status.json',
          ]
          missing=[needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'missing candidate-training contract text: {missing}')

          forbidden=[
              'arena-inference-latest',
              'liveunjuno.vercel.app/api',
              'VERCEL_TOKEN',
              'VERCEL_OIDC_TOKEN',
              'cancel-in-progress: true',
          ]
          found=[needle for needle in forbidden if needle in text]
          if found:
              raise SystemExit(f'forbidden auto-promotion/Vercel mutation returned: {found}')

          print('continuous candidate training contract: PASS')
          PY
