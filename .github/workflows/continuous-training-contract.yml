name: continuous-training-contract
on:
  pull_request:
    paths:
      - '.github/workflows/continuous-training*.yml'
      - 'scripts/*combat*'
      - 'src/connectome_fighter/combat_*.py'
      - 'configs/*combat*.json'
      - 'tests/test_combat_*.py'
      - 'scripts/append_training_history.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-training*.yml'
      - 'scripts/*combat*'
      - 'src/connectome_fighter/combat_*.py'
      - 'configs/*combat*.json'
      - 'tests/test_combat_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4' 'pytest==8.3.5' 'PyYAML==6.0.2'
      - name: Reward, lineage and non-overlapping candidate publication contracts
        run: PYTHONPATH=src python -m pytest -q tests/test_combat_reward.py tests/test_combat_checkpoint.py tests/test_combat_schedule.py
      - name: History remains idempotent and rejects existing-generation forks
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          cp site/data/training-status.json "$temp/status.json"
          cp site/data/training-history.json "$temp/history.json"
          python scripts/append_training_history.py --status "$temp/status.json" --history "$temp/history.json"
          before="$(sha256sum "$temp/history.json" | cut -d' ' -f1)"
          python scripts/append_training_history.py --status "$temp/status.json" --history "$temp/history.json"
          test "$before" = "$(sha256sum "$temp/history.json" | cut -d' ' -f1)"
          python - "$temp/status.json" <<'PY'
          import json,sys
          p=sys.argv[1];s=json.load(open(p));s['state_sha256']='0'*64
          json.dump(s,open(p,'w'))
          PY
          if python scripts/append_training_history.py --status "$temp/status.json" --history "$temp/history.json"; then
            echo 'Existing-generation fork was accepted' >&2
            exit 1
          fi
