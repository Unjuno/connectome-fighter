name: terminal-credit-gain-counterfactual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/terminal-credit-gain-counterfactual.yml'
      - 'scripts/terminal_credit_gain_counterfactual.py'
      - 'scripts/update_malecns_terminal_gain_counterfactual.py'
      - 'tests/test_terminal_credit_gain_counterfactual.py'
      - 'docs/REWARD_EXPERIMENT.md'

permissions:
  contents: read

concurrency:
  group: terminal-credit-gain-counterfactual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  RUNTIME_ROOT: /home/vercel-sandbox/connectome-runtime/arena-runtime
  RUNTIME_ASSET_ID: '568215636'
  RUNTIME_SHA256: a5f03b13890dbe6b29ef5e646f885b92013610dc4f8c16b2a54b94393d8c73c4
  PARENT_ASSET_ID: '599773615'
  PARENT_ARCHIVE: garnet-g000049-a5c2394d69eecba2.tar.gz
  PARENT_ARCHIVE_SHA256: 9f2b970836d634f6de4b67b0f6b98c3bc5f9d6de539156701a6e27f88cdc3671
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5'
      - run: python -m py_compile scripts/terminal_credit_gain_counterfactual.py scripts/update_malecns_terminal_gain_counterfactual.py
      - run: PYTHONPATH=src python -m pytest -q tests/test_terminal_credit_gain_counterfactual.py

  counterfactual:
    needs: contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned runtime and Gen49 parent bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runs/terminal-credit/deps runs/terminal-credit/parent
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RUNTIME_ASSET_ID" \
            -H 'Accept: application/octet-stream' > runs/terminal-credit/deps/runtime.tar.gz
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$PARENT_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "runs/terminal-credit/parent/$PARENT_ARCHIVE"
          echo "$RUNTIME_SHA256  runs/terminal-credit/deps/runtime.tar.gz" | sha256sum -c -
          echo "$PARENT_ARCHIVE_SHA256  runs/terminal-credit/parent/$PARENT_ARCHIVE" | sha256sum -c -
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path('runs/terminal-credit/dependencies.json').write_text(json.dumps({
              'runtime_asset_id': int(os.environ['RUNTIME_ASSET_ID']),
              'runtime_sha256': os.environ['RUNTIME_SHA256'],
              'parent_asset_id': int(os.environ['PARENT_ASSET_ID']),
              'parent_archive': os.environ['PARENT_ARCHIVE'],
              'parent_archive_sha256': os.environ['PARENT_ARCHIVE_SHA256'],
          }, indent=2, sort_keys=True)+'\n')
          PY
          sudo mkdir -p "$(dirname "$RUNTIME_ROOT")"
          sudo chown -R "$(id -u):$(id -g)" /home/vercel-sandbox
          tar -xzf runs/terminal-credit/deps/runtime.tar.gz -C "$(dirname "$RUNTIME_ROOT")"

      - name: Reproduce win/loss traces and test terminal credit gain
        run: |
          python scripts/terminal_credit_gain_counterfactual.py \
            --runtime-root "$RUNTIME_ROOT" \
            --parent-archive "runs/terminal-credit/parent/$PARENT_ARCHIVE" \
            --out runs/terminal-credit/experiment \
            --timeout-seconds 3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-credit-gain-counterfactual-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            runs/terminal-credit/dependencies.json
            runs/terminal-credit/experiment/result.json
            runs/terminal-credit/experiment/update-*.json
            runs/terminal-credit/experiment/*.log
            runs/terminal-credit/experiment/states/*/*/GARNET.npz.json
            runs/terminal-credit/experiment/matches/*/status.json
            runs/terminal-credit/experiment/matches/*/p1.jsonl
