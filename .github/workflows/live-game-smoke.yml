name: live-game-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-game-smoke.yml'
      - 'scripts/run_game.py'
      - 'src/connectome_fighter/pyftg_bridge.py'
      - 'src/connectome_fighter/observations.py'
      - 'src/connectome_fighter/session.py'
      - 'src/connectome_fighter/trajectory.py'
      - 'src/connectome_fighter/match_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-game-smoke
  cancel-in-progress: true

env:
  # Upstream GHCR 'latest' was inspected on 2026-09-11 and is an image created
  # 2024-05-24. Pin its digest and use the v6.3-documented pyftg compatibility
  # only to validate our bridge. This is NOT the v7.1 research runtime.
  GAME_IMAGE: ghcr.io/teamfightingice/fightingice@sha256:c859607071cffc5b18aaa3faa1b3132557b1d6c241aadf4e9e686c541e2c13cd
  PYFTG_VERSION: '2.1.1'

jobs:
  bridge-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bridge-compatible runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
          python -m pip install "pyftg==$PYFTG_VERSION"
          python - <<'PY'
          import importlib.metadata
          print('pyftg', importlib.metadata.version('pyftg'))
          PY

      - name: Start pinned upstream FightingICE container
        run: |
          mkdir -p runs/game runs/live
          docker pull "$GAME_IMAGE"
          docker inspect "$GAME_IMAGE" > runs/game-image-inspect.json
          printf '%s\n' "$GAME_IMAGE" > runs/game-image.txt
          docker run -d --rm --name fightingice \
            -p 31415:31415 \
            -v "$PWD/runs/game:/app/log" \
            "$GAME_IMAGE"

      - name: Wait for FightingICE server
        run: |
          ready=0
          for i in $(seq 1 60); do
            if docker logs fightingice 2>&1 | grep -q 'Socket server is started'; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs fightingice 2>&1 | tee runs/fightingice-before.log
          test "$ready" -eq 1

      - name: Run actual Random vs Random match
        id: match
        continue-on-error: true
        run: |
          python scripts/run_game.py \
            --host 127.0.0.1 --port 31415 --games 1 \
            --policy random --seed-p1 10 --seed-p2 20 \
            --timeout 180 --out runs/live

      - name: Capture post-match evidence
        if: always()
        run: |
          docker logs fightingice 2>&1 | tee runs/fightingice-after.log || true
          docker ps -a --no-trunc > runs/docker-ps.txt || true

      - name: Stop game
        if: always()
        run: docker stop fightingice || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-game-smoke-evidence
          path: runs/
          if-no-files-found: warn

      - name: Enforce bridge smoke pass
        if: always()
        run: |
          if [ '${{ steps.match.outcome }}' != 'success' ]; then
            echo 'Bridge compatibility smoke failed; inspect evidence.' >&2
            exit 1
          fi
