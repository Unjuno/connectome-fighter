name: fightingice-lightweight-socket-smoke

on:
  pull_request:
    paths:
      - 'scripts/run_live_arena_server.py'
      - 'deploy/arena-runtime/stage-fightingice-lightweight.sh'
      - 'deploy/arena-runtime/build-jre21.sh'
      - '.github/workflows/fightingice-lightweight-socket-smoke.yml'
      - '.github/workflows/publish-arena-runtime-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fightingice-lightweight-socket-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  socket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pyftg client for full-round verification
        run: python -m pip install 'numpy==2.3.5' 'pyftg==2.3'

      - name: Download verified FightingICE v7.1 runtime
        run: |
          set -euo pipefail
          mkdir -p external/v71 external/downloads
          curl -fL --retry 4 --retry-all-errors -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 4 --retry-all-errors -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"

      - name: Stage production-equivalent lightweight assets
        run: |
          set -euo pipefail
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          bash deploy/arena-runtime/stage-fightingice-lightweight.sh \
            "$GAME_DIR" runs/packaged-fightingice
          bash deploy/arena-runtime/build-jre21.sh \
            "$JAVA_HOME" runs/jre21

          test -d runs/packaged-fightingice/data/ai
          test -z "$(find runs/packaged-fightingice/data/ai -mindepth 1 -print -quit)"
          test ! -d runs/packaged-fightingice/lib/lwjgl/natives
          game_bytes="$(du -sb runs/packaged-fightingice | awk '{print $1}')"
          jre_bytes="$(du -sb runs/jre21 | awk '{print $1}')"
          echo "packaged_fightingice_bytes=$game_bytes"
          echo "jlink_jre_bytes=$jre_bytes"
          test "$game_bytes" -lt $((140 * 1024 * 1024))
          test "$jre_bytes" -lt $((180 * 1024 * 1024))

      - name: Require full pyftg round on packaged runtime
        run: |
          set -euo pipefail
          mkdir -p runs/lightweight-socket
          GAME_DIR="$GITHUB_WORKSPACE/runs/packaged-fightingice"
          JAVA="$GITHUB_WORKSPACE/runs/jre21/bin/java"
          (
            cd "$GAME_DIR"
            "$JAVA" -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*' Main \
              --lightweight-mode --pyftg-mode --input-sync \
              --limithp 400 400 --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/lightweight-socket/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/lightweight-socket/fightingice.pid"
          )
          cleanup() {
            kill "$(cat runs/lightweight-socket/fightingice.pid 2>/dev/null || true)" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 45); do
            if grep -q 'Socket server is started' runs/lightweight-socket/fightingice.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat runs/lightweight-socket/fightingice.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat runs/lightweight-socket/fightingice.log || true
          test "$ready" -eq 1

          # run_game.py never updates weights; omit --evaluation so its existing
          # pair-audit contract validates the emitted trace as trainable-format data.
          PYTHONPATH=src python scripts/run_game.py \
            --host 127.0.0.1 --port 31415 \
            --games 1 --policy random \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 10101 --seed-p2 20202 \
            --expected-rounds 1 --timeout 180 \
            --run-id minimal-lightweight-runtime \
            --out runs/lightweight-match

          python - <<'PY'
          import json
          s=json.load(open('runs/lightweight-match/minimal-lightweight-runtime/status.json'))
          assert s['status']=='COMPLETED_WITH_VALIDATED_TRACES'
          assert s['completed_rounds_per_agent']==[1,1]
          assert s['learning_performed'] is False
          assert s['evaluation'] is False
          print({'status':s['status'],'rounds':s['completed_rounds_per_agent'],'learning':s['learning_performed']})
          PY

      - name: Verify live arena defaults to lightweight mode
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/run_live_arena_server.py').read_text(encoding='utf-8')
          assert 'choices=["lightweight", "headless"]' in text
          assert 'default="lightweight"' in text
          assert 'processing_flag = "--lightweight-mode"' in text
          assert 'FightingICE.jar:./lib/*:./lib/lwjgl/*' in text
          print('live arena FightingICE mode contract: lightweight')
          PY
