name: routing-benchmark-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/routing-benchmark-smoke.yml'
      - 'scripts/make_routing_from_annotations.py'
      - 'scripts/benchmark_graph.py'
      - 'scripts/import_shiu_flywire.py'
      - 'src/connectome_fighter/brain.py'
      - 'src/connectome_fighter/graph.py'
      - 'src/connectome_fighter/routing.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-benchmark-smoke
  cancel-in-progress: true

env:
  SHIU_COMMIT: 91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  ANNOT_COMMIT: 8587524c1748ce5ef2080822a2fc890fc03bf597

jobs:
  route-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU/data runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[data,test]'

      - name: Fetch pinned graph and annotation sources
        run: |
          mkdir -p external/shiu783 external/annotations data/processed/shiu783 runs/routing
          SHIU_BASE="https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT"
          ANNOT_BASE="https://raw.githubusercontent.com/flyconnectome/flywire_annotations/$ANNOT_COMMIT"
          curl -fL --retry 3 -o external/shiu783/Completeness_783.csv "$SHIU_BASE/Completeness_783.csv"
          curl -fL --retry 3 -o external/shiu783/Connectivity_783.parquet "$SHIU_BASE/Connectivity_783.parquet"
          curl -fL --retry 3 -o external/annotations/neurons.tsv \
            "$ANNOT_BASE/supplemental_files/Supplemental_file1_neuron_annotations.tsv"
          sha256sum external/shiu783/* external/annotations/neurons.tsv | tee runs/routing/source-sha256.txt

      - name: Normalize Shiu/FlyWire v783 graph
        run: |
          python scripts/import_shiu_flywire.py \
            --completeness external/shiu783/Completeness_783.csv \
            --connectivity external/shiu783/Connectivity_783.parquet \
            --out data/processed/shiu783 \
            --source-version "FlyWire 783 / Shiu table @ $SHIU_COMMIT" \
            --source-url "https://github.com/philshiu/Drosophila_brain_model/tree/$SHIU_COMMIT" \
            --license "CC BY-NC 4.0 (FlyWire public release data)" \
            | tee runs/routing/import-report.json
          cp data/processed/shiu783/manifest.json runs/routing/graph-manifest.json

      - name: Build deterministic sensory-to-descending routing
        run: |
          python scripts/make_routing_from_annotations.py \
            --nodes data/processed/shiu783/nodes.csv \
            --annotations external/annotations/neurons.tsv \
            --out data/processed/shiu783/routing.json \
            --seed 20260911 \
            --neurons-per-polarity-per-feature 32 \
            --input-scale 0.25 \
            --annotation-source "https://github.com/flyconnectome/flywire_annotations/tree/$ANNOT_COMMIT" \
            --annotation-version "$ANNOT_COMMIT" \
            | tee runs/routing/routing-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('data/processed/shiu783/routing.json').read_text())
          summary = {
              'schema_version': r['schema_version'],
              'routing_sha256': r['routing_sha256'],
              'graph_nodes_sha256': r['graph_nodes_sha256'],
              'annotation_source': r['annotation_source'],
              'annotation_version': r['annotation_version'],
              'annotation_file_sha256': r['annotation_file_sha256'],
              'selection': r['selection'],
              'selected_input_neurons': len(r['input_nodes']),
              'selected_output_neurons': len(r['output_nodes']),
              'full_routing_uploaded': False,
              'reproduction_note': 'Regenerate from exact source commits, checksums, script commit and routing seed; annotation-derived ID lists are not uploaded by this workflow.'
          }
          Path('runs/routing/routing-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

      - name: Benchmark one-step whole-graph CPU inference
        run: |
          PYTHONPATH=src python scripts/benchmark_graph.py \
            --graph-dir data/processed/shiu783 \
            --routing data/processed/shiu783/routing.json \
            --threads 1 --neural-steps 1 --repeats 3 \
            --out runs/routing/benchmark.json

      - name: Remove source and dataset-derived bulk files
        if: always()
        run: |
          rm -rf external data/processed/shiu783/nodes.csv data/processed/shiu783/edges.csv data/processed/shiu783/routing.json || true

      - name: Upload provenance and benchmark only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-benchmark-provenance
          path: runs/routing/
          if-no-files-found: error
