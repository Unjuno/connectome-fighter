name: malecns-structure-index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_malecns_structure_index.py'
      - '.github/workflows/malecns-structure-index.yml'

permissions:
  contents: read

concurrency:
  group: malecns-structure-index
  cancel-in-progress: true

env:
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  STRUCTURE_CACHE_KEY: malecns-v1.0-structure-index-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=16,<24'
      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Restore structural index cache
        id: structure-cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-structure-v1
          key: ${{ env.STRUCTURE_CACHE_KEY }}
      - name: Build structural index
        if: steps.structure-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf data/processed/malecns-structure-v1
          python scripts/build_malecns_structure_index.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --out data/processed/malecns-structure-v1
      - name: Validate structural index
        run: |
          test -s data/processed/malecns-structure-v1/body_structure.csv.gz
          test -s data/processed/malecns-structure-v1/manifest.json
          python - <<'PY'
          import gzip,json
          m=json.load(open('data/processed/malecns-structure-v1/manifest.json'))
          assert m['dataset']=='male-cns:v1.0'
          assert m['purpose']=='spectator-only-structural-index'
          assert m['policy_access'] is False
          assert m['bodies'] > 150000
          with gzip.open('data/processed/malecns-structure-v1/body_structure.csv.gz','rt') as f:
              header=f.readline().strip(); first=f.readline().strip()
          assert header.startswith('bodyId,superclass'), header
          assert first
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: malecns-structure-index-manifest
          path: data/processed/malecns-structure-v1/manifest.json
          if-no-files-found: error
          retention-days: 30
