name: canonical-checkpoint-resume

on:
  workflow_dispatch:
  workflow_run:
    workflows: [canonical-checkpoint-seed]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: canonical-checkpoint-resume
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  VALENCE_CACHE_KEY: malecns-v1.0-kc-mbon-valence-v1
  RELEASE_TAG: canonical-state-smoke-v1
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  resume:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generation-1 durable release checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/release
          gh release download "$RELEASE_TAG" \
            --pattern 'garnet-g1.tar.gz' \
            --pattern 'garnet-g1.tar.gz.sha256' \
            --pattern 'checkpoint-manifest.json' \
            --dir runs/release
          (cd runs/release && sha256sum -c garnet-g1.tar.gz.sha256)
          mkdir -p runs/checkpoint
          tar -C runs/checkpoint -xzf runs/release/garnet-g1.tar.gz
          python - <<'PY'
          import hashlib,json,pathlib
          rel=json.load(open('runs/release/checkpoint-manifest.json'))
          packed=json.load(open('runs/checkpoint/checkpoint-manifest.json'))
          state=pathlib.Path('runs/checkpoint/state/GARNET.npz')
          meta=json.load(open(str(state)+'.json'))
          sha=hashlib.sha256(state.read_bytes()).hexdigest()
          assert rel==packed
          assert rel['state_sha256']==sha==meta['state_sha256']
          assert rel['generation']==1==meta['generation']
          assert rel['character']=='GARNET'==meta['character']
          print(json.dumps({'exact_restore':True,'state_sha256':sha,'generation':meta['generation']},indent=2))
          PY

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.24.0' 'pandas==1.5.3' 'pyarrow==10.0.1' 'joblib==1.2.0' 'Cython==0.29.36' 'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"

      - name: Set up bridge/update Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge/update dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==23.0.1' 'pyftg==2.3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore valence partition cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-valence-v1
          key: ${{ env.VALENCE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build fixed game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 --decision-window-ms 20 --neutral-min-spikes 1

      - name: Materialize restored GARNET generation 1 adapter
        run: |
          PYTHONPATH=src python scripts/materialize_malecns_valence_adapter.py \
            --base-adapter data/processed/malecns-shiu-strict-v1 \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --state runs/checkpoint/state/GARNET.npz \
            --character GARNET \
            --plasticity-config configs/plasticity_valence_v0.json \
            --out runs/garnet-g1-adapter

      - name: Fetch pinned Shiu model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 -o external/shiu-reference/model.py "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713
      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Start FightingICE
        run: |
          mkdir -p runs/resume
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          GAME_DIR="$(dirname "$GAME_JAR")"
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/resume/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/resume/fightingice.pid"
          )
          for i in $(seq 1 90); do
            grep -q 'Socket server is started' runs/resume/fightingice.log 2>/dev/null && exit 0
            kill -0 "$(cat runs/resume/fightingice.pid)" 2>/dev/null || exit 1
            sleep 1
          done
          exit 1

      - name: Run one match from restored generation 1
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 800101 --seed-p2 800202 \
            --reference-python "$PY310" --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --adapter-dir-p1 runs/garnet-g1-adapter \
            --adapter-dir-p2 data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 --games 1 --expected-rounds 1 --timeout 900 \
            --trainable-trace --run-id resume-g1 --out runs/resume

      - name: Update restored state to generation 2
        run: |
          PYTHONPATH=src python scripts/update_malecns_valence_plasticity.py \
            --character GARNET --side 1 \
            --round-trace runs/resume/resume-g1/p1.jsonl \
            --spikes runs/resume/resume-g1/p1-brain/spikes.parquet \
            --candidates data/processed/malecns-valence-v1/kc_mbon_valence_candidates.parquet \
            --reward-config configs/reward_r2d_v0.json \
            --plasticity-config configs/plasticity_valence_v0.json \
            --state runs/checkpoint/state/GARNET.npz \
            --out-summary runs/resume/garnet-g2-update.json
          python - <<'PY'
          import json
          u=json.load(open('runs/resume/garnet-g2-update.json'))
          assert u['status']=='PASS'
          assert u['state_source']=='checkpoint'
          assert u['state']['generation']==2 and u['state']['matches']==2
          assert u['updates']['potentiated_edges']==0
          assert u['updates']['depressed_edges']>0
          print(json.dumps({'restored_from_checkpoint':True,'signals':u['signals'],'updates':u['updates'],'state':u['state']},indent=2))
          PY

      - name: Package generation 2 proof without enabling continuous training
        run: |
          mkdir -p runs/g2/state runs/g2/evidence
          cp runs/checkpoint/state/GARNET.npz runs/g2/state/GARNET.npz
          cp runs/checkpoint/state/GARNET.npz.json runs/g2/state/GARNET.npz.json
          cp runs/resume/garnet-g2-update.json runs/g2/evidence/garnet-g2-update.json
          cp runs/resume/resume-g1/status.json runs/g2/evidence/resume-match-status.json
          python - <<'PY'
          import hashlib,json,pathlib
          state=pathlib.Path('runs/g2/state/GARNET.npz')
          meta=json.load(open(str(state)+'.json'))
          sha=hashlib.sha256(state.read_bytes()).hexdigest()
          assert meta['state_sha256']==sha and meta['generation']==2
          manifest={
            'schema_version':1,'kind':'canonical-character-checkpoint-smoke','character':'GARNET','generation':2,
            'previous_generation':1,'exact_previous_restore_verified':True,'model':meta['model'],'reward_id':meta['reward_id'],
            'candidate_sha256':meta['candidate_sha256'],'config_sha256':meta['config_sha256'],'state_sha256':sha,
            'purpose':'second independent Actions run resume proof; continuous learning remains disabled'
          }
          pathlib.Path('runs/g2/checkpoint-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY
          tar -C runs/g2 -czf runs/garnet-g2.tar.gz .
          sha256sum runs/garnet-g2.tar.gz | tee runs/garnet-g2.tar.gz.sha256

      - name: Publish generation 2 proof assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            runs/garnet-g2.tar.gz \
            runs/garnet-g2.tar.gz.sha256 \
            runs/g2/checkpoint-manifest.json#checkpoint-manifest-g2.json \
            --clobber

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/resume/fightingice.pid ]; then kill "$(cat runs/resume/fightingice.pid)" 2>/dev/null || true; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-checkpoint-resume-evidence
          path: |
            runs/release/checkpoint-manifest.json
            runs/resume/garnet-g2-update.json
            runs/g2/checkpoint-manifest.json
            runs/garnet-g2.tar.gz.sha256
            runs/resume/resume-g1/status.json
          if-no-files-found: warn
          retention-days: 30
