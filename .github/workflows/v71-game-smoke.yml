name: v71-game-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v71-game-smoke.yml'
      - 'scripts/run_game.py'
      - 'src/connectome_fighter/pyftg_bridge.py'
      - 'src/connectome_fighter/observations.py'
      - 'src/connectome_fighter/session.py'
      - 'src/connectome_fighter/trajectory.py'
      - 'src/connectome_fighter/match_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v71-game-smoke
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  v71-random-vs-random:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pyftg 2.3 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[game,test]'
          java -version 2>&1 | tee runs-java-version.txt
          python - <<'PY'
          import importlib.metadata
          print('pyftg', importlib.metadata.version('pyftg'))
          PY

      - name: Download and verify FightingICE v7.1 release
        run: |
          mkdir -p external/v71 runs/game runs/live
          curl -fL --retry 3 -o external/DareFightingICE-7.1.zip "$GAME_URL"
          curl -fL --retry 3 -o external/resource-7.1.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/DareFightingICE-7.1.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/resource-7.1.zip" | sha256sum -c -
          unzip -q external/DareFightingICE-7.1.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          GAME_DIR="$(dirname "$GAME_JAR")"
          unzip -q -o external/resource-7.1.zip -d "$GAME_DIR"
          printf '%s\n' "$GAME_DIR" > runs/game-dir.txt
          find "$GAME_DIR" -maxdepth 2 -type f | sort | head -200 > runs/v71-file-sample.txt

      - name: Start FightingICE v7.1 with Java 21
        run: |
          GAME_DIR="$(cat runs/game-dir.txt)"
          (
            cd "$GAME_DIR"
            # Short, deterministic integration smoke: one 600-frame round.
            # --input-sync is the upstream v7.1 recommendation for faster training/headless runs.
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 \
              --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/fightingice-v71.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/fightingice-v71.pid"
          )

      - name: Wait for FightingICE v7.1 server
        run: |
          ready=0
          for i in $(seq 1 90); do
            if grep -q 'Socket server is started' runs/fightingice-v71.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat runs/fightingice-v71.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat runs/fightingice-v71.log || true
          test "$ready" -eq 1

      - name: Run actual v7.1 Random vs Random match
        id: match
        continue-on-error: true
        run: |
          python scripts/run_game.py \
            --host 127.0.0.1 --port 31415 --games 1 \
            --policy random --seed-p1 10 --seed-p2 20 \
            --timeout 120 --expected-rounds 1 --out runs/live

      - name: Capture post-match evidence
        if: always()
        run: |
          cat runs/fightingice-v71.log || true
          ps -ef > runs/ps.txt || true
          cp configs/game_release.json runs/game_release.json

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/fightingice-v71.pid ]; then
            kill "$(cat runs/fightingice-v71.pid)" 2>/dev/null || true
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-game-smoke-evidence
          path: runs/
          if-no-files-found: warn

      - name: Enforce v7.1 pass
        if: always()
        run: |
          if [ '${{ steps.match.outcome }}' != 'success' ]; then
            echo 'FightingICE v7.1 live match failed; inspect evidence.' >&2
            exit 1
          fi
