name: dedicated-web-contract

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'vercel.json'
      - '.github/workflows/dedicated-web-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'vercel.json'
      - '.github/workflows/dedicated-web-contract.yml'

permissions:
  contents: read

concurrency:
  group: dedicated-web-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck dedicated public app
        run: npm run typecheck
      - name: Build dedicated public app
        run: npm run build
      - name: Prove project isolation and spectator boundaries
        run: |
          set -euo pipefail
          ! grep -R -F 'liveunjuno.vercel.app' app lib vercel.json
          ! grep -R -F 'prj_T1i5PPgfjHXAKGLf9Gmoboae61Tk' app lib vercel.json
          grep -Fq 'process.env.VERCEL_PROJECT_ID' lib/vercel-sandbox.ts
          grep -Fq 'flybody_game_telemetry_position_used: false' app/api/live/route.ts
          grep -Fq 'policy_pixel_access: false' app/api/live/route.ts
          grep -Fq 'No SVG or FightingICE-position puppet is substituted here.' app/live-client.tsx
