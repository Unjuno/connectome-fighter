name: readout-sensitivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readout-sensitivity.yml'
      - 'scripts/readout_sensitivity_experiment.py'
      - 'scripts/paired_search_game.py'
      - 'src/connectome_fighter/neural_readout.py'
  pull_request:
    paths:
      - '.github/workflows/readout-sensitivity.yml'
      - 'scripts/readout_sensitivity_experiment.py'
      - 'scripts/paired_search_game.py'
      - 'src/connectome_fighter/neural_readout.py'

permissions:
  contents: read

concurrency:
  group: readout-sensitivity-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  RUNTIME_ROOT: /home/vercel-sandbox/connectome-runtime/arena-runtime
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  actual-game-readout:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract and syntax checks
        run: |
          set -euo pipefail
          python -m py_compile scripts/readout_sensitivity_experiment.py scripts/paired_search_game.py src/connectome_fighter/neural_readout.py
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from connectome_fighter.neural_readout import READOUT_MODES
          assert READOUT_MODES == ('canonical','delta','ema-residual')
          text=Path('scripts/paired_search_game.py').read_text()
          assert '--readout-mode' in text
          assert 'p1_readout_uses_game_state' in text
          assert 'TemporalReadoutPolicy' in text
          PY
      - name: Install official renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fontconfig fonts-dejavu-core ffmpeg
      - name: Pin runtime and current candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/fetch_combat_dependencies.py --out runs/readout
          sudo mkdir -p "$(dirname "$RUNTIME_ROOT")"
          sudo chown -R "$(id -u):$(id -g)" /home/vercel-sandbox
          tar -xzf runs/readout/runtime.tar.gz -C "$(dirname "$RUNTIME_ROOT")"
          lscpu > runs/readout/cpu.txt
          git rev-parse HEAD > runs/readout/tested-checkout.txt
      - name: Actual canonical and residual neural-readout games
        run: |
          set -euo pipefail
          BRIDGE="$RUNTIME_ROOT/$(cat "$RUNTIME_ROOT/runtime/python311.path")"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$RUNTIME_ROOT/runtime/site311" \
            "$BRIDGE" scripts/readout_sensitivity_experiment.py \
            --runtime-root "$RUNTIME_ROOT" \
            --source-archive runs/readout/source.tar.gz \
            --out runs/readout --timeout-seconds 1500
      - name: Verify result boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('runs/readout/result.json'))
          assert r['status']=='PASS'
          assert r['modes']==['canonical','delta','ema-residual']
          assert r['decision_interval_frames']==60 and r['fixed_neural_window_ms']==20.0
          assert r['learning_performed'] is False and r['weights_changed'] is False
          assert r['readout_game_state_used'] is False
          assert len(r['results']['neutral'])==3 and len(r['results']['canonical'])==3
          for row in r['results']['neutral']+r['results']['canonical']:
              assert row['source_state_sha256']==r['candidate_state_sha256']
          print(json.dumps({
              'generation':r['candidate_generation'],
              'neutral':[(x['readout_mode'],x['metrics']['minimum_observed_distance_px'],x['metrics']['damage_dealt_hp'],x['p1_action_histogram']) for x in r['results']['neutral']],
              'canonical':[(x['readout_mode'],x['metrics']['minimum_observed_distance_px'],x['metrics']['damage_dealt_hp'],x['p1_action_histogram']) for x in r['results']['canonical']],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readout-sensitivity-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            runs/readout/result.json
            runs/readout/partial-results.json
            runs/readout/dependencies.json
            runs/readout/tested-checkout.txt
            runs/readout/cpu.txt
            runs/readout/*-game.log
            runs/readout/matches/*/result.json
            runs/readout/matches/*/p1.jsonl
            runs/readout/matches/*/p2.jsonl
            runs/readout/matches/*/observed-frames.jsonl
            runs/readout/matches/*/p1-brain/*
            runs/readout/matches/*/p2-brain/*
            runs/readout/matches/*/screen.mp4
