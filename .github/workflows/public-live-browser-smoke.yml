name: public-live-browser-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        required: false
        type: string
  workflow_run:
    workflows: [vercel-live-arena-smoke]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-live-browser-smoke
  cancel-in-progress: true

jobs:
  mobile-publication:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && ((github.event_name == 'workflow_dispatch' && inputs.base_url != '') || vars.CONNECTOME_PUBLIC_BASE_URL != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ inputs.base_url || vars.CONNECTOME_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save 'playwright@1.57.0'
      - run: npx playwright install --with-deps chromium
      - name: Require responsive dedicated publication
        run: |
          case "$BASE" in *liveunjuno.vercel.app*) exit 1;; esac
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{const browser=await chromium.launch({headless:true});try{
            for(const viewport of [{width:320,height:720,label:'320px'},{width:390,height:844,label:'390px'}]){
              const page=await browser.newPage({viewport}); await page.goto(`${process.env.BASE}/`,{waitUntil:'networkidle',timeout:60000});
              const game=page.getByText('Official FightingICE ScreenData',{exact:true}); const brain=page.getByText('P1 MaleCNS activity',{exact:true}); const fly=page.getByText('MaleCNS activity drives the actual FlyBody MuJoCo fly.',{exact:true});
              await game.waitFor({state:'visible',timeout:20000}); await brain.waitFor({state:'visible',timeout:20000}); await fly.waitFor({state:'visible',timeout:20000});
              const g=await game.boundingBox(), b=await brain.boundingBox(), f=await fly.boundingBox(); assert(g&&b&&f); assert(g.y<b.y); assert(b.y<f.y);
              const layout=await page.evaluate(()=>({innerWidth:innerWidth,htmlScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,fixedElements:Array.from(document.querySelectorAll('body *')).filter(el=>getComputedStyle(el).position==='fixed').length,text:document.body.textContent||''}));
              assert(layout.htmlScrollWidth<=layout.innerWidth); assert(layout.bodyScrollWidth<=layout.innerWidth); assert.equal(layout.fixedElements,0);
              assert(layout.text.includes('No synthetic fight frame is substituted.')); assert(layout.text.includes('No SVG or FightingICE-position puppet is substituted here.')); assert(layout.text.includes('Real annotated MaleCNS motor/descending body activity'));
              await page.close(); console.log({viewport:viewport.label,htmlScrollWidth:layout.htmlScrollWidth});
            }
          }finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
