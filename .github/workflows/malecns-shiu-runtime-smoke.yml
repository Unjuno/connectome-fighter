name: malecns-shiu-runtime-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shiu_malecns_runtime_smoke.py'
      - '.github/workflows/malecns-shiu-runtime-smoke.yml'

permissions:
  contents: read

concurrency:
  group: malecns-shiu-runtime-smoke
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install published reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.24.0' \
            'pandas==1.5.3' \
            'pyarrow==10.0.1' \
            'joblib==1.2.0' \
            'brian2==2.5.1'

      - name: Restore canonical MaleCNS adapter cache
        id: adapter-cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Fetch pinned Shiu reference model
        run: |
          mkdir -p external/shiu-reference artifacts/malecns-runtime
          curl -fL --retry 3 \
            -o external/shiu-reference/model.py \
            "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          sha256sum external/shiu-reference/model.py > artifacts/malecns-runtime/model.py.sha256

      - name: Construct and advance full strict MaleCNS network
        run: |
          /usr/bin/time -v python scripts/shiu_malecns_runtime_smoke.py \
            --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --run-ms 0.2 \
            --out artifacts/malecns-runtime/runtime-smoke.json \
            2> artifacts/malecns-runtime/time.txt
          cat artifacts/malecns-runtime/runtime-smoke.json
          cat artifacts/malecns-runtime/time.txt

      - uses: actions/upload-artifact@v4
        with:
          name: malecns-shiu-runtime-smoke
          path: artifacts/malecns-runtime/
          if-no-files-found: error
          retention-days: 30
