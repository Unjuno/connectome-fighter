name: rollout-checkout-snapshot
on:
  push:
    branches: ['integration/paired-training-rollout-20260915']
    paths: ['.github/workflows/rollout-checkout-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/checkout-evidence"
          git archive --format=tar HEAD > "$RUNNER_TEMP/checkout-evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/checkout-evidence/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/checkout-evidence/tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rollout-checkout-source
          path: ${{ runner.temp }}/checkout-evidence
          retention-days: 1
          if-no-files-found: error
