name: pages-manual-redeploy

# Manual fallback only. The authoritative deployment is produced at the end of
# malecns-baseline-batch.yml, after canonical MaleCNS artifacts are aggregated.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual-redeploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Redeploy current canonical dashboard
        id: deployment
        uses: actions/deploy-pages@v4
