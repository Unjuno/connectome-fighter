name: pages-research-ledger-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'configs/reward_r2d_v0.json'
      - 'configs/plasticity_valence_v0.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-research-ledger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate normalized public evidence when present
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/app.js
          python - <<'PY'
          import json
          reward=json.load(open('configs/reward_r2d_v0.json'))
          plasticity=json.load(open('configs/plasticity_valence_v0.json'))
          assert reward['id']=='R2d-v0'
          assert reward['fixed_during_comparison']['epsilon_greedy'] is False
          assert reward['fixed_during_comparison']['specific_action_reward'] is False
          assert plasticity['reward_config']==reward['id']
          print({'reward':reward['id'],'reward_status':reward['status'],'plasticity':plasticity['id'],'plasticity_status':plasticity['status']})
          PY
          if [ -f site/data/matches.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('site/data/matches.json'))
          assert d['kind']=='normalized-fightingice-match-log'
          assert d['match_count']==len(d['matches'])
          print({'matches':d['match_count'],'updated_at':d['updated_at']})
          PY
          fi

      - name: Stage exact research contracts
        run: |
          rm -rf site/research-data site/live
          mkdir -p site/research-data
          cp configs/reward_r2d_v0.json site/research-data/reward.json
          cp configs/plasticity_valence_v0.json site/research-data/plasticity.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy research ledger and evidence data
        id: deployment
        uses: actions/deploy-pages@v4
