name: pages-static-preview

# Manual preview only. The authoritative public Pages deployment is produced by
# continuous-training.yml so a source-code push cannot overwrite learned status
# and replay JSON with repository placeholders.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
