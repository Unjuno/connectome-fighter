name: public-surface-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'README.ja.md'
      - 'ROADMAP.md'
      - 'docs/STATUS.md'
      - 'docs/PUBLIC_SURFACE_SPLIT.md'
      - 'docs/PUBLIC_SURFACE_SPLIT.ja.md'
      - 'docs/SPECTATOR_PIPELINE.ja.md'
      - 'site/index.html'
      - 'site/app.js'
      - 'scripts/validate_public_surface_contract.py'
      - '.github/workflows/vercel-live-arena-smoke.yml'
      - '.github/workflows/precompile-arena-brian2-cython-cache.yml'
      - '.github/workflows/render-fightingice-video.yml'
      - '.github/workflows/public-surface-contract.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.ja.md'
      - 'ROADMAP.md'
      - 'docs/STATUS.md'
      - 'docs/PUBLIC_SURFACE_SPLIT.md'
      - 'docs/PUBLIC_SURFACE_SPLIT.ja.md'
      - 'docs/SPECTATOR_PIPELINE.ja.md'
      - 'site/index.html'
      - 'site/app.js'
      - 'scripts/validate_public_surface_contract.py'
      - '.github/workflows/vercel-live-arena-smoke.yml'
      - '.github/workflows/precompile-arena-brian2-cython-cache.yml'
      - '.github/workflows/render-fightingice-video.yml'
      - '.github/workflows/public-surface-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen public architecture
        run: python scripts/validate_public_surface_contract.py
