name: malecns-live-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_game_malecns_lif.py'
      - 'scripts/malecns_lif_worker.py'
      - 'src/connectome_fighter/malecns_worker_policy.py'
      - 'src/connectome_fighter/malecns_trace.py'
      - 'src/connectome_fighter/session.py'
      - 'src/connectome_fighter/pyftg_bridge.py'
      - '.github/workflows/malecns-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: malecns-live-smoke
  cancel-in-progress: true

env:
  SHIU_COMMIT: 2a83ad611cd9768f8c9723fc613ed27761a5feb5
  ADAPTER_CACHE_KEY: malecns-v1.0-shiu-strict-minw5-2a83ad611cd9768f8c9723fc613ed27761a5feb5-adapter-v1
  GAME_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/DareFightingICE-7.1.zip
  GAME_SHA256: 510752a69a097b767677d3911b1407d6a08a721dad4faf2cb5b7a19b988f1c62
  RESOURCE_URL: https://github.com/TeamFightingICE/FightingICE/releases/download/v7.1/resource-7.1.zip
  RESOURCE_SHA256: 386fd713f901db00583054528ccfbce315953c157dc16231c4367416d86dce53

jobs:
  canonical-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up reference Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned Shiu/Brian2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.24.0' \
            'pandas==1.5.3' \
            'pyarrow==10.0.1' \
            'joblib==1.2.0' \
            'Cython==0.29.36' \
            'brian2==2.5.1'
          echo "PY310=$(which python)" >> "$GITHUB_ENV"
          g++ --version

      - name: Set up bridge Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FightingICE bridge and trace dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.3.5' \
            'pandas==2.3.3' \
            'pyarrow==23.0.1' \
            'pyftg==2.3'
          python - <<'PY'
          import sys, pyftg, numpy, pandas, pyarrow
          print(sys.version)
          print('bridge deps OK', numpy.__version__, pandas.__version__, pyarrow.__version__)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore canonical MaleCNS adapter cache
        uses: actions/cache@v4
        with:
          path: data/processed/malecns-shiu-strict-v1
          key: ${{ env.ADAPTER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build fixed non-NN game interface
        run: |
          mkdir -p data/processed/malecns-interface-v1
          python scripts/build_malecns_game_interface.py \
            --metadata data/processed/malecns-shiu-strict-v1/neuron_metadata.parquet \
            --manifest data/processed/malecns-shiu-strict-v1/manifest.json \
            --out data/processed/malecns-interface-v1/interface.json \
            --seed 20260911 \
            --input-bodies-per-polarity-feature 16 \
            --max-poisson-rate-hz 150 \
            --decision-window-ms 20 \
            --neutral-min-spikes 1

      - name: Fetch pinned Shiu reference model
        run: |
          mkdir -p external/shiu-reference
          curl -fL --retry 3 \
            -o external/shiu-reference/model.py \
            "https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/$SHIU_COMMIT/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  external/shiu-reference/model.py' | sha256sum -c -

      - name: Restore FightingICE v7.1 cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: external/v71
          key: fightingice-v71-510752a6-386fd713

      - name: Download verified FightingICE v7.1 on cache miss
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external/v71 external/downloads
          curl -fL --retry 3 -o external/downloads/game.zip "$GAME_URL"
          curl -fL --retry 3 -o external/downloads/resource.zip "$RESOURCE_URL"
          echo "$GAME_SHA256  external/downloads/game.zip" | sha256sum -c -
          echo "$RESOURCE_SHA256  external/downloads/resource.zip" | sha256sum -c -
          unzip -q external/downloads/game.zip -d external/v71
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          unzip -q -o external/downloads/resource.zip -d "$(dirname "$GAME_JAR")"
          rm -rf external/downloads

      - name: Start FightingICE headless server
        run: |
          mkdir -p runs/malecns-live
          GAME_JAR="$(find external/v71 -type f -name FightingICE.jar -print -quit)"
          test -n "$GAME_JAR"
          GAME_DIR="$(dirname "$GAME_JAR")"
          (
            cd "$GAME_DIR"
            nohup java -cp 'FightingICE.jar:./lib/*:./lib/lwjgl/*:./lib/lwjgl/natives/linux/amd64/*:./lib/grpc/*' \
              Main --headless-mode --pyftg-mode --input-sync --limithp 400 400 \
              --port 31415 -r 1 -f 600 \
              > "$GITHUB_WORKSPACE/runs/malecns-live/fightingice.log" 2>&1 &
            echo $! > "$GITHUB_WORKSPACE/runs/malecns-live/fightingice.pid"
          )
          ready=0
          for i in $(seq 1 90); do
            if grep -q 'Socket server is started' runs/malecns-live/fightingice.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$(cat runs/malecns-live/fightingice.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          cat runs/malecns-live/fightingice.log || true
          test "$ready" -eq 1

      - name: Run one canonical GARNET vs ZEN round
        run: |
          PYTHONPATH=src python scripts/run_game_malecns_lif.py \
            --host 127.0.0.1 --port 31415 \
            --character-p1 GARNET --character-p2 ZEN \
            --seed-p1 10101 --seed-p2 20202 \
            --reference-python "$PY310" \
            --reference-model external/shiu-reference/model.py \
            --adapter-dir data/processed/malecns-shiu-strict-v1 \
            --interface data/processed/malecns-interface-v1/interface.json \
            --decision-interval 60 \
            --games 1 --expected-rounds 1 --timeout 1800 \
            --run-id canonical-garnet-zen \
            --out runs/malecns-live

      - name: Stop FightingICE
        if: always()
        run: |
          if [ -f runs/malecns-live/fightingice.pid ]; then
            kill "$(cat runs/malecns-live/fightingice.pid)" 2>/dev/null || true
          fi

      - name: Validate canonical evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          root=Path('runs/malecns-live/canonical-garnet-zen')
          s=json.load(open(root/'status.json'))
          assert s['canonical'] is True
          assert s['learning_performed'] is False
          assert s['status']=='COMPLETED_WITH_VALIDATED_CANONICAL_TRACES'
          assert s['completed_rounds_per_agent']==[1,1]
          for side in ['p1-brain','p2-brain']:
              b=root/side
              assert (b/'run-manifest.json').is_file()
              assert (b/'decisions.jsonl').stat().st_size > 0
              assert (b/'spikes.parquet').is_file()
              rows=pq.ParquetFile(b/'spikes.parquet').metadata.num_rows
              assert rows > 0, f'{side} produced no spikes'
              manifest=json.load(open(b/'run-manifest.json'))
              assert manifest['dataset']=='male-cns:v1.0'
              assert 'Shiu' in manifest['dynamics']['model_name']
              print(side, 'spikes', rows)
          PY

      - name: Upload canonical live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-live-smoke
          path: |
            runs/malecns-live/canonical-garnet-zen/status.json
            runs/malecns-live/canonical-garnet-zen/p1.jsonl
            runs/malecns-live/canonical-garnet-zen/p2.jsonl
            runs/malecns-live/canonical-garnet-zen/p1-brain/run-manifest.json
            runs/malecns-live/canonical-garnet-zen/p1-brain/decisions.jsonl
            runs/malecns-live/canonical-garnet-zen/p1-brain/spikes.parquet
            runs/malecns-live/canonical-garnet-zen/p1-brain/worker-stderr.log
            runs/malecns-live/canonical-garnet-zen/p2-brain/run-manifest.json
            runs/malecns-live/canonical-garnet-zen/p2-brain/decisions.jsonl
            runs/malecns-live/canonical-garnet-zen/p2-brain/spikes.parquet
            runs/malecns-live/canonical-garnet-zen/p2-brain/worker-stderr.log
            runs/malecns-live/fightingice.log
          if-no-files-found: warn
          retention-days: 30
