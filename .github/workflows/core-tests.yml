name: core-tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/smoke_core.py'
      - 'scripts/run_game.py'
      - 'scripts/run_game_malecns_lif.py'
      - 'scripts/run_live_arena_server.py'
      - 'scripts/run_live_screen_publisher.py'
      - 'scripts/run_live_activity_publisher.py'
      - 'scripts/train_chunk.py'
      - 'scripts/package_training_state.py'
      - 'scripts/restore_training_state.py'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/smoke_core.py'
      - 'scripts/run_game.py'
      - 'scripts/run_game_malecns_lif.py'
      - 'scripts/run_live_arena_server.py'
      - 'scripts/run_live_screen_publisher.py'
      - 'scripts/run_live_activity_publisher.py'
      - 'scripts/train_chunk.py'
      - 'scripts/package_training_state.py'
      - 'scripts/restore_training_state.py'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m py_compile scripts/run_game.py scripts/run_game_malecns_lif.py scripts/run_live_arena_server.py scripts/run_live_screen_publisher.py scripts/run_live_activity_publisher.py scripts/train_chunk.py scripts/package_training_state.py scripts/restore_training_state.py
      - run: python scripts/smoke_core.py
