name: core-tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/smoke_core.py'
      - 'scripts/run_game.py'
      - 'scripts/train_chunk.py'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/smoke_core.py'
      - 'scripts/run_game.py'
      - 'scripts/train_chunk.py'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m py_compile scripts/run_game.py scripts/train_chunk.py
      - run: python scripts/smoke_core.py
