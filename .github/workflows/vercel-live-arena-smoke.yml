name: vercel-live-arena-smoke

# Prove that the public Vercel surface exposes exactly one shared read-only
# FightingICE + MaleCNS broadcast from the currently published runtime SHA.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [precompile-arena-brian2-cython-cache]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-live-arena-smoke.yml'
      - 'scripts/validate_public_surface_contract.py'

permissions:
  contents: read

concurrency:
  group: vercel-live-arena-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://liveunjuno.vercel.app
      RUNTIME_RELEASE: https://github.com/Unjuno/connectome-fighter/releases/download/arena-runtime-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository public-surface contract
        run: python scripts/validate_public_surface_contract.py

      - name: Resolve exact published runtime identity
        run: |
          set -euo pipefail
          sha_text="$(curl -fsSL "$RUNTIME_RELEASE/arena-runtime.tar.gz.sha256")"
          runtime_sha="$(printf '%s' "$sha_text" | grep -Eo '[a-f0-9]{64}' | head -1)"
          [[ "$runtime_sha" =~ ^[a-f0-9]{64}$ ]]
          runtime_base="connectome-runtime-${runtime_sha:0:16}"
          echo "RUNTIME_SHA=$runtime_sha" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE=$runtime_base" >> "$GITHUB_ENV"
          printf 'runtime_sha=%s\nruntime_base=%s\n' "$runtime_sha" "$runtime_base"

      - name: Require public individual-session creation to stay disabled
        run: |
          set -euo pipefail
          get_body="$(curl -fsS "$BASE/api/connectome/session")"
          echo "$get_body" | jq .
          test "$(echo "$get_body" | jq -r '.mode')" = 'single-shared-live-broadcast'
          test "$(echo "$get_body" | jq -r '.audience_scope')" = 'shared-global'
          test "$(echo "$get_body" | jq -r '.learning_enabled')" = 'false'
          test "$(echo "$get_body" | jq -r '.policy_pixel_access')" = 'false'

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$BASE/api/connectome/session" \
            -H 'content-type: application/json' --data '{"p1":"GARNET","p2":"ZEN"}')"
          post_body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "$post_body" | jq .
          test "$code" = '409'
          test "$(echo "$post_body" | jq -r '.error')" = 'shared_broadcast_only'
          test "$(echo "$post_body" | jq -r '.mode')" = 'single-shared-live-broadcast'

      - name: Wait for shared LIVE to adopt the exact runtime release
        run: |
          set -euo pipefail
          ready=0
          last=''
          for i in $(seq 1 180); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "$BASE/api/connectome/live" || true)"
            body="$(cat "$tmp")"
            rm -f "$tmp"
            if [[ -n "$body" ]]; then
              last="$body"
              echo "$body" | jq '{mode,broadcast_target,audience_scope,ready,status,p1,p2,stream_url,telemetry_url,session_id,source_runtime_base,runtime_archive_sha256,learning_enabled,policy_pixel_access,retention,maintenance_action,reason}'
              test "$(echo "$body" | jq -r '.mode')" = 'single-shared-live-broadcast'
              test "$(echo "$body" | jq -r '.broadcast_target')" = 'connectome-live-broadcast'
              test "$(echo "$body" | jq -r '.audience_scope')" = 'shared-global'
              test "$(echo "$body" | jq -r '.p1')" = 'GARNET'
              test "$(echo "$body" | jq -r '.p2')" = 'ZEN'
              test "$(echo "$body" | jq -r '.learning_enabled')" = 'false'
              test "$(echo "$body" | jq -r '.policy_pixel_access')" = 'false'
              test "$(echo "$body" | jq -r '.retention')" = 'one-shared-ephemeral-live-broadcast'

              status="$(echo "$body" | jq -r '.status // empty')"
              case "$status" in
                auth-unavailable|runtime-unavailable)
                  echo "Shared LIVE hard failure: $status" >&2
                  echo "$body" | jq . >&2
                  exit 1
                  ;;
              esac

              sha="$(echo "$body" | jq -r '.runtime_archive_sha256 // empty')"
              base="$(echo "$body" | jq -r '.source_runtime_base // empty')"
              if [[ "$sha" == "$RUNTIME_SHA" && "$base" == "$RUNTIME_BASE" && \
                    "$(echo "$body" | jq -r '.ready')" == 'true' && "$status" == 'running' ]]; then
                telemetry="$(echo "$body" | jq -r '.telemetry_url // empty')"
                stream="$(echo "$body" | jq -r '.stream_url // empty')"
                test -n "$telemetry"
                test -n "$stream"
                echo "TELEMETRY_URL=$telemetry" >> "$GITHUB_ENV"
                echo "STREAM_URL=$stream" >> "$GITHUB_ENV"
                ready=1
                break
              fi
            fi
            [[ "$code" == '200' || "$code" == '202' ]] || {
              echo "Unexpected /api/connectome/live HTTP $code" >&2
              [[ -n "$body" ]] && echo "$body" | jq . >&2 || true
              exit 1
            }
            sleep 4
          done
          if [[ "$ready" -ne 1 ]]; then
            echo 'Shared LIVE did not become ready on the published runtime before the deadline.' >&2
            [[ -n "$last" ]] && echo "$last" | jq . >&2 || true
            exit 1
          fi

      - name: Require real FightingICE movement and both MaleCNS decisions
        run: |
          set -euo pipefail
          last=''
          for i in $(seq 1 300); do
            body="$(curl -fsS "$TELEMETRY_URL" || true)"
            if [[ -n "$body" ]]; then
              last="$body"
              echo "$body" | jq '{status,round,frame,p1:{character:.p1.character,hp:.p1.hp,x:.p1.x,y:.p1.y,action:.p1.action,facing:.p1.facing},p2:{character:.p2.character,hp:.p2.hp,x:.p2.x,y:.p2.y,action:.p2.action,facing:.p2.facing},p1_decision:.brain.p1.decision_index,p2_decision:.brain.p2.decision_index,p1_spikes:.brain.p1.total_spikes,p2_spikes:.brain.p2.total_spikes,learning_enabled,policy_pixel_access,error,exit_code}'
              test "$(echo "$body" | jq -r '.learning_enabled')" = 'false'
              test "$(echo "$body" | jq -r '.policy_pixel_access')" = 'false'
              status="$(echo "$body" | jq -r '.status // empty')"
              if [[ "$status" == 'error' ]]; then
                echo "$body" | jq . >&2
                exit 1
              fi
              if echo "$body" | jq -e '
                .status == "running" and
                (.frame | type == "number") and .frame > 0 and
                .p1.character == "GARNET" and .p2.character == "ZEN" and
                (.p1.x | type == "number") and (.p1.y | type == "number") and
                (.p2.x | type == "number") and (.p2.y | type == "number") and
                (.p1.action | type == "string") and (.p2.action | type == "string") and
                (.brain.p1.decision_index | type == "number") and .brain.p1.decision_index > 0 and
                (.brain.p2.decision_index | type == "number") and .brain.p2.decision_index > 0
              ' >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'No frame>0 telemetry with decisions from both MaleCNS workers arrived.' >&2
          [[ -n "$last" ]] && echo "$last" | jq . >&2 || true
          exit 1

      - name: Verify public page identifies the shared LIVE and served lineage state
        run: |
          set -euo pipefail
          html="$(curl -fsS "$BASE/connectome")"
          grep -Fq 'One shared Vercel LIVE' <<<"$html"
          grep -Fq 'GitHub research / training logs' <<<"$html"
          grep -Fq 'public inference provenance' <<<"$html"
          grep -Fq 'GARNET G2 approved · ZEN baseline' <<<"$html"
          grep -Fq 'candidate G2 is not served' <<<"$html"
