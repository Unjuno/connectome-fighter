name: vercel-live-arena-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Dedicated Connectome Vercel base URL; falls back to CONNECTOME_PUBLIC_BASE_URL repository variable
        required: false
        type: string
  workflow_run:
    workflows: [publish-flybody-runtime-addon]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - '.github/workflows/vercel-live-arena-smoke.yml'

permissions:
  contents: read

concurrency:
  group: vercel-live-arena-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && ((github.event_name == 'workflow_dispatch' && inputs.base_url != '') || vars.CONNECTOME_PUBLIC_BASE_URL != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ inputs.base_url || vars.CONNECTOME_PUBLIC_BASE_URL }}
      RUNTIME_RELEASE: https://github.com/Unjuno/connectome-fighter/releases/download/arena-runtime-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse the legacy Unjuno live project
        run: |
          set -euo pipefail
          test -n "$BASE"
          case "$BASE" in *liveunjuno.vercel.app*) echo 'Refusing to test the unrelated Unjuno live project.' >&2; exit 1;; esac
      - name: Resolve exact rolling runtime identity
        run: |
          set -euo pipefail
          sha_text="$(curl -fsSL "$RUNTIME_RELEASE/arena-runtime.tar.gz.sha256?t=$(date +%s%N)")"
          runtime_sha="$(printf '%s' "$sha_text" | grep -Eo '[a-f0-9]{64}' | head -1)"
          [[ "$runtime_sha" =~ ^[a-f0-9]{64}$ ]]
          echo "RUNTIME_SHA=$runtime_sha" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE=connectome-runtime-${runtime_sha:0:16}" >> "$GITHUB_ENV"
      - name: Wait for dedicated shared LIVE on exact runtime
        run: |
          set -euo pipefail
          ready=0; last=''
          for i in $(seq 1 240); do
            tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' "$BASE/api/live?t=$(date +%s%N)" || true)"; body="$(cat "$tmp")"; rm -f "$tmp"
            if [[ -n "$body" ]]; then
              last="$body"
              echo "$body" | jq '{mode,broadcast_target,audience_scope,ready,status,p1,p2,telemetry_url,source_runtime_base,runtime_archive_sha256,maintenance_action,reason,blocked_until}'
              status="$(echo "$body" | jq -r '.status // empty')"
              if [[ "$status" == capacity-blocked ]]; then echo "$body" | jq . >&2; exit 1; fi
              case "$status" in auth-unavailable|project-unavailable|runtime-release-unavailable) echo "$body" | jq . >&2; exit 1;; esac
              test "$(echo "$body" | jq -r '.mode // empty')" = 'single-shared-live-broadcast' || true
              if [[ "$(echo "$body" | jq -r '.ready // false')" == true && "$status" == running ]]; then
                test "$(echo "$body" | jq -r '.broadcast_target')" = 'connectome-fighter-live-broadcast'
                test "$(echo "$body" | jq -r '.audience_scope')" = 'shared-global'
                test "$(echo "$body" | jq -r '.p1')" = 'GARNET'
                test "$(echo "$body" | jq -r '.p2')" = 'ZEN'
                test "$(echo "$body" | jq -r '.learning_enabled')" = false
                test "$(echo "$body" | jq -r '.policy_pixel_access')" = false
                test "$(echo "$body" | jq -r '.runtime_archive_sha256')" = "$RUNTIME_SHA"
                test "$(echo "$body" | jq -r '.source_runtime_base')" = "$RUNTIME_BASE"
                telemetry="$(echo "$body" | jq -r '.telemetry_url // empty')"; test -n "$telemetry"
                echo "TELEMETRY_URL=$telemetry" >> "$GITHUB_ENV"; ready=1; break
              fi
            fi
            [[ "$code" == 200 || "$code" == 202 || "$code" == 503 ]] || { echo "unexpected HTTP $code" >&2; exit 1; }
            sleep 4
          done
          if [[ "$ready" -ne 1 ]]; then [[ -n "$last" ]] && echo "$last" | jq . >&2 || true; exit 1; fi
      - name: Require synchronized sensory-to-motor FightingICE telemetry
        run: |
          set -euo pipefail
          last=''
          for i in $(seq 1 300); do
            body="$(curl -fsS "$TELEMETRY_URL?t=$(date +%s%N)" || true)"
            if [[ -n "$body" ]]; then
              last="$body"
              if echo "$body" | jq -e '
                def action_keys: ["FORWARD","BACKWARD","UP","DOWN","A","B","C"];
                def numeric_sensory($brain): ($brain.sensory_drive|type)=="array" and ($brain.sensory_drive|length)>0 and ($brain.sensory_drive|all(.[];(.body_id|type)=="number" and (.rate_hz|type)=="number" and .rate_hz>0));
                def numeric_motor($brain): ($brain.output_contributions|type)=="array" and ($brain.output_contributions|length)>0 and ($brain.output_contributions|all(.[];(.group|type)=="string" and (.body_id|type)=="number" and (.spikes|type)=="number" and .spikes>0));
                def neural_consistent($brain;$fighter):
                  ($brain.group_spike_counts|type)=="object" and (action_keys|all(. as $k|($brain.group_spike_counts[$k]|type)=="number")) and numeric_sensory($brain) and numeric_motor($brain) and
                  ($brain.biological_time_start_ms|type)=="number" and ($brain.biological_time_end_ms|type)=="number" and $brain.biological_time_end_ms>$brain.biological_time_start_ms and
                  ($brain.membrane_summary|type)=="object" and ($brain.membrane_summary.v_mean_mV|type)=="number" and ($brain.membrane_summary.g_mean_mV|type)=="number" and
                  if $fighter.action=="NEUTRAL" then (action_keys|map($brain.group_spike_counts[.]//0)|max)==0 else (action_keys|index($fighter.action))!=null and ($brain.group_spike_counts[$fighter.action]==(action_keys|map($brain.group_spike_counts[.]//0)|max)) end;
                .status=="running" and (.schema_version|type)=="number" and .schema_version>=3 and .rounds_per_session==6 and (.frame|type)=="number" and .frame>0 and
                .p1.character=="GARNET" and .p2.character=="ZEN" and (.p1.x|type)=="number" and (.p1.y|type)=="number" and (.p2.x|type)=="number" and (.p2.y|type)=="number" and
                (.brain.p1.decision_index|type)=="number" and .brain.p1.decision_index>0 and (.brain.p2.decision_index|type)=="number" and .brain.p2.decision_index>0 and
                neural_consistent(.brain.p1;.p1) and neural_consistent(.brain.p2;.p2) and .learning_enabled==false and .policy_pixel_access==false
              ' >/dev/null; then exit 0; fi
            fi
            sleep 2
          done
          [[ -n "$last" ]] && echo "$last" | jq . >&2 || true
          exit 1
      - name: Verify dedicated page boundaries
        run: |
          set -euo pipefail
          html="$(curl -fsS "$BASE/")"
          grep -Fq 'Official FightingICE ScreenData' <<<"$html"
          grep -Fq 'No synthetic fight frame is substituted' <<<"$html"
          grep -Fq 'P1 MaleCNS activity' <<<"$html"
          grep -Fq 'P2 MaleCNS activity' <<<"$html"
          grep -Fq 'MaleCNS activity drives the actual FlyBody MuJoCo fly.' <<<"$html"
          grep -Fq 'No SVG or FightingICE-position puppet is substituted here.' <<<"$html"
