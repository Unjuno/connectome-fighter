services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.fightingice-v71
    command:
      - --headless-mode
      - --pyftg-mode
      - --input-sync
      - --limithp
      - "400"
      - "400"
      - --port
      - "31415"
      - -r
      - "1"
      - -f
      - "600"
    ports:
      - "127.0.0.1:31415:31415"
    volumes:
      - ./runs/game:/opt/fightingice/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/31415' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      game:
        condition: service_healthy
    command:
      - python
      - scripts/run_game.py
      - --host
      - game
      - --port
      - "31415"
      - --policy
      - random
      - --games
      - "1"
      - --expected-rounds
      - "1"
      - --timeout
      - "120"
      - --out
      - runs/live
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data:ro
    restart: "no"
