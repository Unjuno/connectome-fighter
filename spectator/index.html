<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectome Fighter Live</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;background:#070a0f;color:#eef4fb}
    main{max-width:1200px;margin:auto;padding:24px 18px 56px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
    h1{font-size:clamp(2rem,5vw,4rem);margin:.1em 0}.muted{color:#92a0b3}.live{display:inline-flex;gap:7px;align-items:center;font-weight:800;letter-spacing:.08em}.dot{width:9px;height:9px;border-radius:50%;background:#ff5964;box-shadow:0 0 16px #ff5964}
    .hero{margin-top:18px;border:1px solid #263243;border-radius:18px;overflow:hidden;background:#0d131c}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:17px 20px}.fighter{font-size:clamp(1.5rem,4vw,2.7rem);font-weight:900}.fighter:last-child{text-align:right}.vs{color:#78879b;font-weight:900}
    video{display:block;width:100%;background:#000;aspect-ratio:3/2}.meta{display:flex;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid #263243;color:#92a0b3;font-size:.9rem}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-top:14px}.card{padding:15px;border:1px solid #263243;border-radius:13px;background:#0e151f}.name{font-weight:900;font-size:1.05rem}.rate{font-size:1.7rem;font-weight:900;margin-top:6px}.small{font-size:.82rem;color:#92a0b3;margin-top:3px}
    .footer{margin-top:18px;display:flex;gap:15px;flex-wrap:wrap;font-size:.9rem}a{color:#8ecbff}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main>
  <div class="top"><div><div class="live"><span class="dot"></span> NEAR LIVE</div><h1>Connectome Fighter</h1><div class="muted">MaleCNS v1.0 + pinned Shiu LIF · FightingICE</div></div><div id="updated" class="muted">loading…</div></div>
  <section class="hero">
    <div class="match"><div id="p1" class="fighter">—</div><div class="vs">VS</div><div id="p2" class="fighter">—</div></div>
    <video id="fight" muted autoplay controls playsinline preload="metadata"><source id="fight-source" src="/live-data/latest-fight.mp4" type="video/mp4"></video>
    <div class="meta"><span id="duration">—</span><span id="rounds">—</span><span>policy pixel access: NO</span><span id="phase">—</span></div>
  </section>
  <div id="cards" class="grid"></div>
  <div class="footer"><a href="https://unjuno.github.io/connectome-fighter/">Experiment logs</a><a href="https://github.com/Unjuno/connectome-fighter/actions">Actions</a><span class="muted">15秒ごとに更新確認。動画は最新spectator runへ自動切替。</span></div>
  <div id="error" class="muted"></div>
</main><script src="./app.js"></script></body></html>
